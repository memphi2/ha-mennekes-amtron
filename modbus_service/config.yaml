name: Mennekes Amtron Modbus Service
version: 0.9.0b5
url: https://github.com/memphi2/ha-mennekes-amtron
slug: mennekes_amtron_modbus
description: Independent Modbus connection and heartbeat for Mennekes Amtron
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
uart: true
udev: true
apparmor: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:ev-station
panel_title: Modbus RTU
discovery:
  - mennekes_amtron_rtu
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Authenticated service API (internal network by default)
watchdog: http://[HOST]:[PORT:8765]/health
options:
  connection_type: USB / RS-485
  host: ""
  tcp_port: 502
  tcp_authentication: false
  tcp_auth_password: ""
  device_id: 50
  baudrate: "57600"
  frame: 8n2
  read_only: true
  current_cap: 6
  state_change_interval_seconds: 300
  phase_switch_grace_seconds: 5
  scan_interval: 5
  measurement_interval: 30
  listen: 0.0.0.0
  port: 8765
schema:
  connection_type: 'list(USB / RS-485|LAN: Modbus RTU (TCP)|LAN: Modbus TCP)'
  serial_port: str?
  host: str?
  tcp_port: port
  tcp_authentication: bool?
  tcp_auth_password: password?
  device_id: int(10,50)
  baudrate: list(9600|14400|19200|28800|38400|56000|57600)
  frame: list(8n2|8e1|8o1)
  read_only: bool
  current_cap: float(6,32)
  state_change_interval_seconds: int(0,3600)
  phase_switch_grace_seconds: int(0,30)
  scan_interval: int(2,300)
  measurement_interval: int(2,300)
  listen: str
  port: int(8765,8765)
