configuration:
  serial_port:
    name: Seriële adapter (pad)
    description: "Kies de USB-adapter in de keuzelijst via Webinterface openen. Het pad wordt hier opgeslagen. Genegeerd voor LAN en verwijderd bij het opslaan van LAN via de webinterface."
  device_id:
    name: Wallboxadres
    description: Het Modbus-adres dat in de wallbox is ingesteld.
  baudrate:
    name: Baudrate
    description: "Alleen voor USB / RS-485: moet overeenkomen met de wallbox. Stel bij LAN de baudrate in op de adapter."
  frame:
    name: Serieel frame
    description: "Alleen voor USB / RS-485: databits, pariteit en stopbits van de wallbox. Stel deze bij LAN in op de adapter."
  read_only:
    name: Alleen lezen
    description: Schakelt laadopdrachten, inclusief de bediening vanuit Home Assistant, en de heartbeat van de service uit; Modbus-leesverzoeken blijven actief.
  current_cap:
    name: Maximale stroom
    description: Maximale aangevraagde EMS-stroom in ampère. Uitdrukkelijke opdrachten voor 0 A verwijderen de EMS-limiet.
  state_change_interval_seconds:
    name: Minimale tijd tussen statuswijzigingen
    description: "Minimaal aantal seconden tussen starten, pauzeren en wijzigingen van de laadtoestemming, vergrendeling of fasen (standaard 300). Te vroege opdrachten worden ingepland; de nieuwste vervangt de vorige. Het schrijfinterval van vijf seconden voor de laadstroom blijft gelden. Stel 0 in om het langere interval uit te schakelen."
  phase_switch_grace_seconds:
    name: "Extra wachttijd vóór fasewisselingen"
    description: "Extra seconden wachttijd nadat het voertuig de laadpauze heeft bevestigd, voordat de fasen worden gewisseld (standaard 5, bereik 0–30). Met 0 vervalt alleen deze extra wachttijd; bevestiging van de laadpauze blijft vereist."
  scan_interval:
    name: Statusinterval
    description: Aantal seconden tussen statusuitlezingen. De heartbeat loopt onafhankelijk.
  measurement_interval:
    name: Meetinterval
    description: Aantal seconden tussen metingen; 30 seconden beperkt de Recorder-belasting.
  listen:
    name: API-luisteradres
    description: Behoud 0.0.0.0 voor toegang via het privénetwerk van de app.
  port:
    name: Interne API-poort
    description: Vast ingesteld op 8765; het beschikbaar stellen van een hostpoort is optioneel en meestal niet nodig.
  connection_type:
    name: Wallboxverbinding
    description: "Kies via Webinterface openen een USB-adapter of vul de LAN-host en poort in. Sla de wijzigingen op en herstart daarna de app."
  host:
    name: Adapterhost / IP-adres
    description: "Verplicht voor LAN: hostnaam of IP-adres van de adapter, zonder URL-schema of pad. Laat dit leeg voor USB / RS-485. Gebruik een vertrouwd privénetwerk."
  tcp_port:
    name: TCP-poort van adapter
    description: TCP-poort die op de adapter is ingesteld; standaard 502. Dit is niet HTTP-poort 8765 van de onafhankelijke service.
  tcp_authentication:
    name: "TCP-aanmelding gebruiken in deze app"
    description: "Dit wijzigt alleen de appverbinding. Lees eerst de instellingen van een compatibele adapter en kies toepassen bij opslaan om de aanmelding ook op de adapter in of uit te schakelen. Gebruik Webinterface openen voor de adapterinstellingen. Aanmelding versleutelt niet en is bij firmware 1.523 te omzeilen. Gebruik een beschermd lokaal netwerk."
  tcp_auth_password:
    name: "Huidig webwachtwoord van de adapter"
    description: "Huidig webwachtwoord voor TCP-aanmelding: 1–9 afdrukbare ASCII-tekens zonder spaties. Laat leeg als TCP-aanmelding is uitgeschakeld. Het adapterwachtwoord wordt hierdoor niet gewijzigd."
network:
  8765/tcp: Service-API met authenticatie; interne toegang vereist geen hostpoort.
