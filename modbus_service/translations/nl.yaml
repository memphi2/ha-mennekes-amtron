configuration:
  serial_port:
    name: Seriële adapter
    description: "Alleen voor USB / RS-485: selecteer de exclusieve USB-RS-485-adapter, bij voorkeur via het vaste /dev/serial/by-id-pad. Laat dit leeg voor LAN."
  device_id:
    name: Wallboxadres
    description: Het Modbus-adres dat in de wallbox is ingesteld.
  baudrate:
    name: Baudrate
    description: "Alleen voor USB / RS-485: moet overeenkomen met de wallbox. Stel bij LAN de baudrate in op de adapter."
  frame:
    name: Serieel frame
    description: "Alleen voor USB / RS-485: databits, pariteit en stopbits van de wallbox. Stel deze bij LAN in op de adapter."
  read_only:
    name: Alleen lezen
    description: Schakelt laadopdrachten, inclusief de bediening vanuit Home Assistant, en de heartbeat van de service uit; Modbus-leesverzoeken blijven actief.
  current_cap:
    name: Maximale stroom
    description: Maximale aangevraagde EMS-stroom in ampère. Uitdrukkelijke opdrachten voor 0 A verwijderen de EMS-limiet.
  state_change_interval_seconds:
    name: Minimale tijd tussen statuswijzigingen
    description: "Seconden vóór opnieuw starten of een fasewisseling (standaard 300). Te vroege opdrachten worden ingepland; de nieuwste vervangt de vorige. Stoppen annuleert een geplande start zonder op dit interval te wachten. Het schrijfinterval van vijf seconden voor de laadstroom blijft gelden. Stel 0 in om het langere interval uit te schakelen."
  scan_interval:
    name: Statusinterval
    description: Aantal seconden tussen statusuitlezingen. De heartbeat loopt onafhankelijk.
  measurement_interval:
    name: Meetinterval
    description: Aantal seconden tussen metingen; 30 seconden beperkt de Recorder-belasting.
  listen:
    name: API-luisteradres
    description: Behoud 0.0.0.0 voor toegang via het privénetwerk van de app.
  port:
    name: Interne API-poort
    description: Vast ingesteld op 8765; het beschikbaar stellen van een hostpoort is optioneel en meestal niet nodig.
  connection_type:
    name: Wallboxverbinding
    description: "USB / RS-485: lokale adapter. LAN: Modbus RTU (TCP): transparante netwerkadapter. LAN: Modbus TCP: gateway die TCP naar RTU vertaalt."
  host:
    name: Adapterhost / IP-adres
    description: "Verplicht voor LAN: hostnaam of IP-adres van de adapter, zonder URL-schema of pad. Laat dit leeg voor USB / RS-485. Gebruik een vertrouwd privénetwerk."
  tcp_port:
    name: TCP-poort van adapter
    description: TCP-poort die op de adapter is ingesteld; standaard 502. Dit is niet HTTP-poort 8765 van de onafhankelijke service.
network:
  8765/tcp: Service-API met authenticatie; interne toegang vereist geen hostpoort.
