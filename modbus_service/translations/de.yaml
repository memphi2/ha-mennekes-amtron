configuration:
  serial_port:
    name: Serieller Adapter (Pfad)
    description: "USB-Adapter unter „Weboberfläche öffnen“ aus der Liste wählen. Dieser Pfad wird dort gespeichert. Bei LAN wird er ignoriert und beim Speichern über die Weboberfläche entfernt."
  device_id:
    name: Wallbox-Adresse
    description: Die in der Wallbox eingestellte Modbus-Adresse.
  baudrate:
    name: Baudrate
    description: "Nur für USB / RS-485: muss zur Wallbox passen. Bei LAN die Baudrate am Adapter einstellen."
  frame:
    name: Serielles Format
    description: "Nur für USB / RS-485: Datenbits, Parität und Stoppbits müssen zur Wallbox passen. Bei LAN am Adapter einstellen."
  read_only:
    name: Nur lesen
    description: Schaltet Steuerbefehle einschließlich der Home-Assistant-Steuerung und den Heartbeat des Dienstes ab; Modbus-Leseanfragen bleiben aktiv.
  current_cap:
    name: Stromobergrenze
    description: Höchster angeforderter EMS-Strom in Ampere. Bewusste Befehle mit 0 A heben die EMS-Begrenzung auf.
  state_change_interval_seconds:
    name: Mindestabstand zwischen Zustandswechseln
    description: "Mindestabstand in Sekunden zwischen Start, Pause, Freigabe-, Sperr- und Phasenwechseln (Standard 300). Zu frühe Befehle werden vorgemerkt; der neueste ersetzt den vorherigen. Der Schreibabstand von fünf Sekunden für den Ladestrom bleibt bestehen. Mit 0 entfällt die längere Wartezeit."
  phase_switch_grace_seconds:
    name: "Zusätzliche Wartezeit vor Phasenwechseln"
    description: "Zusätzliche Sekunden zwischen der bestätigten Ladepause des Fahrzeugs und dem Phasenwechsel (Standard 5, Bereich 0–30). Mit 0 entfällt nur diese zusätzliche Wartezeit; die Ladepause muss weiterhin bestätigt werden."
  scan_interval:
    name: Statusintervall
    description: Sekunden zwischen Statusabfragen. Der Heartbeat läuft unabhängig davon.
  measurement_interval:
    name: Messwertintervall
    description: Sekunden zwischen Messwertabfragen; 30 Sekunden begrenzen die Recorder-Last.
  listen:
    name: API-Listenadresse
    description: Für den Zugriff über das private App-Netzwerk bei 0.0.0.0 belassen.
  port:
    name: Interner API-Port
    description: Fest auf 8765; eine Freigabe am Host ist optional und normalerweise unnötig.
  connection_type:
    name: Wallbox-Verbindung
    description: "Die Verbindung am einfachsten unter „Weboberfläche öffnen“ einstellen: USB-Adapterliste oder LAN-Host und Port. Änderungen speichern und die App anschließend neu starten."
  host:
    name: Adapter-Host / IP-Adresse
    description: "Bei LAN erforderlich: Hostname oder IP-Adresse des Adapters, ohne URL-Schema oder Pfad. Bei USB / RS-485 leer lassen. Ein vertrauenswürdiges privates Netzwerk verwenden."
  tcp_port:
    name: TCP-Port des Adapters
    description: Am Adapter eingestellter TCP-Port; Standard 502. Das ist nicht der HTTP-Port 8765 des eigenständigen Dienstes.
  tcp_authentication:
    name: "TCP-Anmeldung in der App verwenden"
    description: "Dies ändert nur die Verbindung der App. Um die Anmeldung auch am kompatiblen Adapter ein- oder auszuschalten, zuerst dessen Einstellungen auslesen und „Adaptereinstellungen beim Speichern anwenden“ auswählen. Die Adaptereinrichtung findest du unter „Weboberfläche öffnen“. Die Anmeldung verschlüsselt nicht und ist bei Firmware 1.523 umgehbar. Ein geschütztes lokales Netz verwenden."
  tcp_auth_password:
    name: "Vorhandenes Webpasswort des Adapters"
    description: "Vorhandenes Webpasswort des Adapters für die TCP-Anmeldung: 1–9 druckbare ASCII-Zeichen ohne Leerzeichen. Bei ausgeschalteter TCP-Anmeldung leer lassen. Das Adapterpasswort wird dadurch nicht geändert."
network:
  8765/tcp: Geschützte Dienst-API; interner Zugriff benötigt keine Portfreigabe am Host.
