configuration:
  serial_port:
    name: Serial adapter (path)
    description: "Choose the USB adapter from the dropdown in Open Web UI. Its path is saved here. Ignored for LAN and removed when saving LAN through the Web UI."
  device_id:
    name: Wallbox address
    description: Modbus address configured in the wallbox.
  baudrate:
    name: Baud rate
    description: "For USB / RS-485 only: match the wallbox. For LAN, configure the baud rate on the adapter."
  frame:
    name: Serial frame
    description: "For USB / RS-485 only: match the wallbox data bits, parity and stop bits. For LAN, configure these on the adapter."
  read_only:
    name: Read-only
    description: Disables charging commands, including Home Assistant controls, and the service heartbeat; Modbus reads remain active.
  current_cap:
    name: Current cap
    description: Maximum requested EMS current in amperes. Explicit 0 A commands remove the EMS limit.
  state_change_interval_seconds:
    name: Minimum time between state changes
    description: "Minimum seconds between charging starts, pauses, release changes, locking or unlocking, and phase changes (default 300). Early commands are queued; the latest command replaces the previous one. The five-second current-write interval still applies. Set 0 to disable the longer interval."
  phase_switch_grace_seconds:
    name: "Extra wait before phase changes"
    description: "Extra seconds to wait after the vehicle confirms its charging pause, before switching phases (default 5, range 0–30). Set 0 to skip only this extra wait; confirmation of the pause is still required."
  scan_interval:
    name: Status interval
    description: Seconds between status polls. The heartbeat runs independently.
  measurement_interval:
    name: Measurement interval
    description: Seconds between measurement polls; 30 seconds limits Recorder traffic.
  listen:
    name: API listen address
    description: Keep 0.0.0.0 for access through the app's private network.
  port:
    name: Internal API port
    description: Fixed at 8765; host port publication is optional and normally unnecessary.
  connection_type:
    name: Wallbox connection
    description: "Use Open Web UI to choose a USB adapter or enter the LAN host and port. Save changes, then restart the app."
  host:
    name: Adapter host / IP
    description: "Required for LAN: adapter host name or IP address, without a URL scheme or path. Leave empty for USB / RS-485. Use a trusted private network."
  tcp_port:
    name: Adapter TCP port
    description: TCP port configured on the adapter; default 502. This is not the independent service HTTP port 8765.
  tcp_authentication:
    name: "Use TCP login in this app"
    description: "This changes the app connection only. To enable or disable login on a compatible adapter, first read its settings and select “Apply adapter settings when saving”. Use Open Web UI for adapter setup. Login does not encrypt traffic; it can be bypassed on firmware 1.523. Use a protected local network."
  tcp_auth_password:
    name: "Existing adapter web password"
    description: "Existing adapter web password for TCP login: 1–9 printable ASCII characters without spaces. This does not change the adapter password."
network:
  8765/tcp: Authenticated service API; internal access needs no host port.
