configuration:
  serial_port:
    name: Adattatore seriale (percorso)
    description: "Scegli l’adattatore USB dal menu Apri interfaccia Web. Il percorso viene salvato qui. Ignorato per LAN e rimosso salvando LAN nell’interfaccia Web."
  device_id:
    name: Indirizzo della wallbox
    description: Indirizzo Modbus configurato nella wallbox.
  baudrate:
    name: Velocità in baud
    description: "Solo per USB / RS-485: deve corrispondere alla wallbox. Per LAN, imposta la velocità sull’adattatore."
  frame:
    name: Formato seriale
    description: "Solo per USB / RS-485: bit dati, parità e bit di stop della wallbox. Per LAN, impostali sull’adattatore."
  read_only:
    name: Sola lettura
    description: Disabilita i comandi di ricarica, compresi i controlli di Home Assistant, e l'heartbeat del servizio; le letture Modbus rimangono attive.
  current_cap:
    name: Corrente massima
    description: Corrente EMS massima richiesta in ampere. I comandi espliciti con 0 A rimuovono il limite EMS.
  state_change_interval_seconds:
    name: Intervallo minimo tra cambiamenti di stato
    description: "Intervallo minimo in secondi tra avvii, pause e cambiamenti del consenso alla ricarica, del blocco o delle fasi (predefinito 300). I comandi anticipati vengono accodati; l’ultimo sostituisce il precedente. Rimane l’intervallo di cinque secondi tra le scritture della corrente. Impostare 0 per disabilitare l’intervallo più lungo."
  phase_switch_grace_seconds:
    name: "Attesa aggiuntiva prima del cambio delle fasi"
    description: "Secondi di attesa aggiuntivi tra la conferma della pausa di ricarica da parte del veicolo e il cambio delle fasi (predefinito 5, da 0 a 30). Impostare 0 per eliminare solo questa attesa aggiuntiva; la conferma della pausa rimane obbligatoria."
  scan_interval:
    name: Intervallo di stato
    description: Secondi tra le letture dello stato. L'heartbeat funziona indipendentemente.
  measurement_interval:
    name: Intervallo delle misurazioni
    description: Secondi tra le letture delle misurazioni; 30 secondi limitano il carico su Recorder.
  listen:
    name: Indirizzo di ascolto API
    description: Mantieni 0.0.0.0 per l'accesso tramite la rete privata dell'app.
  port:
    name: Porta API interna
    description: Fissa a 8765; esporre la porta sull'host è facoltativo e normalmente non necessario.
  connection_type:
    name: Connessione wallbox
    description: "Apri l’interfaccia Web per scegliere un adattatore USB o inserire host e porta LAN. Salva le modifiche e riavvia l’app."
  host:
    name: Host / indirizzo IP adattatore
    description: "Obbligatorio per LAN: nome host o indirizzo IP dell’adattatore, senza schema o percorso URL. Lascia vuoto per USB / RS-485. Usa una rete privata affidabile."
  tcp_port:
    name: Porta TCP adattatore
    description: Porta TCP configurata sull’adattatore; valore predefinito 502. Non è la porta HTTP 8765 del servizio indipendente.
network:
  8765/tcp: API del servizio con autenticazione; l'accesso interno non richiede una porta esposta sull'host.
