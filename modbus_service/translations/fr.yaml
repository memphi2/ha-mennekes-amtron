configuration:
  serial_port:
    name: Adaptateur série (chemin)
    description: "Choisissez l’adaptateur USB dans la liste de l’interface Web. Son chemin est enregistré ici. Ignoré pour le réseau et supprimé lors de l’enregistrement réseau dans l’interface Web."
  device_id:
    name: Adresse de la borne
    description: "Adresse de la borne sur le bus RS-485, même avec LAN. Valeur d’usine : 50 ; plage prise en charge : 10–50. Utilisez l’adresse configurée dans la borne."
  baudrate:
    name: Vitesse de transmission
    description: "Pour USB / RS-485 uniquement : doit correspondre à la borne. En mode réseau, réglez le débit sur l’adaptateur."
  frame:
    name: Format de trame série
    description: "Pour USB / RS-485 uniquement : bits de données, parité et bits d’arrêt de la borne. En mode réseau, réglez-les sur l’adaptateur."
  read_only:
    name: Lecture seule
    description: "Activé : surveillance seule ; commandes de charge et heartbeat désactivés, y compris depuis Home Assistant. Désactivez cette option pour autoriser le heartbeat et les commandes. Les lectures Modbus continuent dans les deux modes."
  current_cap:
    name: Plafond du courant
    description: Courant de charge maximal demandé par le gestionnaire d’énergie, en ampères. Une commande explicite à 0 A supprime la limite du gestionnaire d’énergie.
  state_change_interval_seconds:
    name: Délai minimal entre changements d’état
    description: "Délai minimal en secondes entre les démarrages, les pauses et les changements d’autorisation de charge, de verrouillage ou de phases (300 par défaut). Les commandes trop précoces sont mises en attente ; la dernière remplace la précédente. L’intervalle de cinq secondes entre écritures du courant reste applicable. La valeur 0 désactive le délai prolongé."
  phase_switch_grace_seconds:
    name: "Attente supplémentaire avant changement de phases"
    description: "Secondes d’attente supplémentaires entre la confirmation de la pause de charge par le véhicule et le changement de phases (5 par défaut, de 0 à 30). La valeur 0 supprime uniquement cette attente supplémentaire ; la confirmation de la pause reste obligatoire."
  scan_interval:
    name: Intervalle de lecture de l’état
    description: Secondes entre les lectures de l’état. Le signal de présence fonctionne indépendamment.
  measurement_interval:
    name: Intervalle des mesures
    description: "Secondes entre les mesures de puissance, tension, courant et énergie. Les 30 secondes par défaut réduisent les mises à jour fréquentes de l’historique Home Assistant. L’état et le heartbeat ont leurs propres intervalles."
  listen:
    name: Adresse d’écoute de l’API
    description: Conservez 0.0.0.0 pour l’accès via le réseau privé de l’application.
  port:
    name: Port interne de l’API
    description: "L’API HTTP de l’application utilise 8765. Home Assistant y accède normalement via le réseau privé des applications sans port publié sur l’hôte. Le port TCP de l’adaptateur LAN se règle séparément."
  connection_type:
    name: Connexion à la borne
    description: "Pour un adaptateur LAN compatible, ouvrez l’interface Web depuis l’onglet Infos de l’application. Choisissez LAN, saisissez l’hôte et sélectionnez « Lire les réglages de l’adaptateur LAN ». Pour le configurer, choisissez « Appliquer les réglages de l’adaptateur lors de l’enregistrement », puis enregistrez et redémarrez l’application. Les adaptateurs USB peuvent aussi y être choisis."
  host:
    name: Hôte / adresse IP de l’adaptateur
    description: "Obligatoire en mode réseau : nom d’hôte ou adresse IP de l’adaptateur, sans schéma ni chemin d’URL. Pour détecter et configurer un adaptateur compatible, saisissez cet hôte dans l’interface Web. Laissez vide pour USB / RS-485. Utilisez un réseau privé de confiance."
  tcp_port:
    name: Port TCP de l’adaptateur
    description: Port TCP configuré sur l’adaptateur ; 502 par défaut. Il ne s’agit pas du port HTTP 8765 du service indépendant.
  tcp_authentication:
    name: "Utiliser l’authentification TCP dans l’application"
    description: "Ce réglage ne change que la connexion de l’application. Pour activer ou désactiver l’authentification sur un adaptateur compatible, lisez ses réglages et sélectionnez leur application à l’enregistrement. Utilisez l’interface Web pour configurer l’adaptateur. L’authentification ne chiffre pas les données et peut être contournée avec le firmware 1.523. Utilisez un réseau local protégé."
  tcp_auth_password:
    name: "Mot de passe web actuel de l’adaptateur"
    description: "Mot de passe web actuel pour l’authentification TCP : 1 à 9 caractères ASCII imprimables sans espaces. Laisser vide si l’authentification TCP est désactivée. Le mot de passe de l’adaptateur n’est pas modifié."
network:
  8765/tcp: API du service avec authentification ; l’accès interne ne nécessite aucun port publié sur l’hôte.
