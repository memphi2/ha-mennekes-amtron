alias: Recharge de nuit
triggers:
  - trigger: time
    at: '22:00:00'
    id: start
  - trigger: time
    at: 06:00:00
    id: stop
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - action: number.set_value
            target:
              entity_id: number.mennekes_amtron_limite_du_courant_de_charge
            data:
              value: 10
      - conditions:
          - condition: trigger
            id: stop
          - condition: state
            entity_id: switch.mennekes_amtron_charge_en_pause
            state: 'off'
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.mennekes_amtron_charge_en_pause
mode: single
