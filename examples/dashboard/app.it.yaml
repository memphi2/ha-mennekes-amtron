# Manual card. Check the translated entity IDs. No helpers or scripts.
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_stato_di_ricarica
  primary: >-
    AMTRON · {{ states('sensor.mennekes_amtron_potenza_totale', with_unit=True) if has_value('sensor.mennekes_amtron_potenza_totale')
    else '—' }}
  secondary: |-
    {{ state_translated('sensor.mennekes_amtron_stato_di_ricarica') if has_value('sensor.mennekes_amtron_stato_di_ricarica') else 'Non disponibile' }}
    Sessione: {{ states('sensor.mennekes_amtron_energia_della_sessione', with_unit=True) if has_value('sensor.mennekes_amtron_energia_della_sessione') else '—' }}
  icon: >-
    {{ 'mdi:ev-station' if is_state('sensor.mennekes_amtron_stato_di_ricarica','charging') else 'mdi:pause-circle'
    if is_state('sensor.mennekes_amtron_stato_di_ricarica','paused') else 'mdi:alert-circle' if states('sensor.mennekes_amtron_stato_di_ricarica')
    in ['wallbox_error','unavailable','unknown'] else 'mdi:ev-plug-type2' }}
  color: >-
    {{ 'green' if is_state('sensor.mennekes_amtron_stato_di_ricarica','charging') else 'amber' if is_state('sensor.mennekes_amtron_stato_di_ricarica','paused')
    else 'red' if states('sensor.mennekes_amtron_stato_di_ricarica') in ['wallbox_error','unavailable','unknown']
    else 'blue' }}
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-number-card
  entity: number.mennekes_amtron_limite_di_corrente_di_ricarica
  name: Limite corrente
  display_mode: slider
- type: custom:mushroom-chips-card
  alignment: center
  chips:
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_ricarica_in_pausa
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_ricarica_in_pausa
      content: >-
        {{ 'In pausa' if is_state('switch.mennekes_amtron_ricarica_in_pausa','on') else 'Pausa' }}
      icon: >-
        {{ 'mdi:pause-circle' if is_state('switch.mennekes_amtron_ricarica_in_pausa','on') else 'mdi:play-circle-outline'
        }}
      icon_color: >-
        {{ 'amber' if is_state('switch.mennekes_amtron_ricarica_in_pausa','on') else 'grey' }}
      tap_action:
        action: toggle
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_consenso_alla_ricarica
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_consenso_alla_ricarica
      content: >-
        {{ 'Abilitato' if is_state('switch.mennekes_amtron_consenso_alla_ricarica','on') else 'Non abilitato' }}
      icon: >-
        {{ 'mdi:power-plug' if is_state('switch.mennekes_amtron_consenso_alla_ricarica','on') else 'mdi:power-plug-off'
        }}
      icon_color: >-
        {{ 'green' if is_state('switch.mennekes_amtron_consenso_alla_ricarica','on') else 'grey' }}
      tap_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_plug_charge_virtuale
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_plug_charge_virtuale
      content: >-
        {{ 'P&C disattivo' if is_state('switch.mennekes_amtron_plug_charge_virtuale','off') else 'P&C pronto' if
        states('sensor.mennekes_amtron_stato_di_plug_charge_virtuale') in ['authorized','manual_release'] else 'P&C
        in attesa' }}
      icon: >-
        {{ 'mdi:car-key' if states('sensor.mennekes_amtron_stato_di_plug_charge_virtuale') in ['authorized','manual_release']
        else 'mdi:car-clock' if is_state('switch.mennekes_amtron_plug_charge_virtuale','on') else 'mdi:car-off'
        }}
      icon_color: >-
        {{ 'grey' if is_state('switch.mennekes_amtron_plug_charge_virtuale','off') else 'green' if states('sensor.mennekes_amtron_stato_di_plug_charge_virtuale')
        in ['authorized','manual_release'] else 'amber' }}
      tap_action:
        action: more-info
  - type: entity
    entity: select.mennekes_amtron_veicolo_attivo
    name: Veicolo
    content_info: state
    icon: mdi:car-multiple
    tap_action:
      action: more-info
- type: custom:mushroom-title-card
  title: ''
  subtitle: 0 A rimuove il limite; sospendere con Pausa.
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_motivo_di_attesa_della_ricarica
  primary: Stato
  secondary: >-
    {{ state_translated('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica') if has_value('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica')
    else 'Non disponibile' }}
  icon: >-
    {{ 'mdi:check-circle-outline' if states('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica') in ['reached',
    'estimated_reached', 'finished'] else 'mdi:alert-circle-outline' if states('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica')
    in ['error', 'interrupted', 'job_storage_unavailable', 'unavailable'] else 'mdi:timer-sand' }}
  color: >-
    {{ 'red' if states('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica') in ['error', 'interrupted', 'job_storage_unavailable',
    'unavailable'] else 'green' if states('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica') in ['active',
    'charging', 'finishing', 'ready', 'reached', 'estimated_reached'] else 'grey' if states('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica')
    in ['disabled', 'none'] else 'amber' }}
  multiline_secondary: true
  tap_action:
    action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_obiettivo_energetico
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Obiettivo di ricarica
      subtitle: kWh aggiuntivi o percentuale veicolo. Solo limite, senza avvio. 0 disattiva il limite.
    - type: entities
      show_header_toggle: false
      entities:
      - entity: number.mennekes_amtron_obiettivo_energetico
        name: Energia aggiuntiva
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_stato_dellobiettivo_energetico
      primary: Energia aggiuntiva
      secondary: >-
        {{ state_translated('sensor.mennekes_amtron_stato_dellobiettivo_energetico') if has_value('sensor.mennekes_amtron_stato_dellobiettivo_energetico')
        else 'Non disponibile' }}
      icon: >-
        {{ 'mdi:check-circle-outline' if states('sensor.mennekes_amtron_stato_dellobiettivo_energetico') in ['reached',
        'estimated_reached', 'finished'] else 'mdi:alert-circle-outline' if states('sensor.mennekes_amtron_stato_dellobiettivo_energetico')
        in ['error', 'interrupted', 'job_storage_unavailable', 'unavailable'] else 'mdi:lightning-bolt' }}
      color: >-
        {{ 'red' if states('sensor.mennekes_amtron_stato_dellobiettivo_energetico') in ['error', 'interrupted',
        'job_storage_unavailable', 'unavailable'] else 'green' if states('sensor.mennekes_amtron_stato_dellobiettivo_energetico')
        in ['active', 'charging', 'finishing', 'ready', 'reached', 'estimated_reached'] else 'grey' if states('sensor.mennekes_amtron_stato_dellobiettivo_energetico')
        in ['disabled', 'none'] else 'amber' }}
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_obiettivo_di_carica_del_veicolo
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-number-card
      entity: number.mennekes_amtron_obiettivo_di_carica_del_veicolo
      name: Livello obiettivo
      display_mode: slider
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo
      primary: Livello obiettivo
      secondary: >-
        {{ state_translated('sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo') if has_value('sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo')
        else 'Non disponibile' }}
      icon: >-
        {{ 'mdi:check-circle-outline' if states('sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo')
        in ['reached', 'estimated_reached', 'finished'] else 'mdi:alert-circle-outline' if states('sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo')
        in ['error', 'interrupted', 'job_storage_unavailable', 'unavailable'] else 'mdi:battery-arrow-up-outline'
        }}
      color: >-
        {{ 'red' if states('sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo') in ['error', 'interrupted',
        'job_storage_unavailable', 'unavailable'] else 'green' if states('sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo')
        in ['active', 'charging', 'finishing', 'ready', 'reached', 'estimated_reached'] else 'grey' if states('sensor.mennekes_amtron_stato_dellobiettivo_di_carica_del_veicolo')
        in ['disabled', 'none'] else 'amber' }}
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_obiettivo_di_carica_del_veicolo
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Obiettivo veicolo opzionale
    secondary: 'Configura → Veicoli: impostare una fonte livello batteria.'
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_stato_ricarica_programmata
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Pianifica partenza
      subtitle: Una sola partenza. Richiede livello batteria e capacità utile. Può rimuovere una pausa manuale.
    - type: entities
      show_header_toggle: false
      entities:
      - entity: datetime.mennekes_amtron_prossima_partenza
        name: Partenza
    - type: custom:mushroom-chips-card
      chips:
      - type: entity
        entity: button.mennekes_amtron_usa_prossimo_evento_calendario
        name: Calendario
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_usa_prossimo_evento_calendario
          confirmation:
            text: Applicare? Un piano di partenza può rimuovere una pausa manuale.
      - type: entity
        entity: button.mennekes_amtron_usa_la_partenza_del_veicolo
        name: Timer veicolo
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_usa_la_partenza_del_veicolo
          confirmation:
            text: Applicare? Un piano di partenza può rimuovere una pausa manuale.
      - type: entity
        entity: button.mennekes_amtron_cancella_ora_di_partenza
        name: Cancella partenza
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_cancella_ora_di_partenza
          confirmation:
            text: Cancellare partenza? I limiti restano; una pausa del piano può terminare.
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_stato_ricarica_programmata
      primary: Stato
      secondary: >-
        {{ state_translated('sensor.mennekes_amtron_stato_ricarica_programmata') if has_value('sensor.mennekes_amtron_stato_ricarica_programmata')
        else 'Non disponibile' }}
      icon: >-
        {{ 'mdi:check-circle-outline' if states('sensor.mennekes_amtron_stato_ricarica_programmata') in ['reached',
        'estimated_reached', 'finished'] else 'mdi:alert-circle-outline' if states('sensor.mennekes_amtron_stato_ricarica_programmata')
        in ['error', 'interrupted', 'job_storage_unavailable', 'unavailable'] else 'mdi:car-clock' }}
      color: >-
        {{ 'red' if states('sensor.mennekes_amtron_stato_ricarica_programmata') in ['error', 'interrupted', 'job_storage_unavailable',
        'unavailable'] else 'green' if states('sensor.mennekes_amtron_stato_ricarica_programmata') in ['active',
        'charging', 'finishing', 'ready', 'reached', 'estimated_reached'] else 'grey' if states('sensor.mennekes_amtron_stato_ricarica_programmata')
        in ['disabled', 'none'] else 'amber' }}
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_stato_ricarica_programmata
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Pianificazione opzionale
    secondary: 'Configura → Veicoli → Prossima partenza: attivare e indicare capacità utile.'
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_bozza_ricarica_ospite
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Ricarica ospite
      subtitle: 'Senza profilo veicolo: energia, durata massima e corrente, poi avvio esplicito. Salvare la bozza
        non avvia nulla.'
    - type: entities
      show_header_toggle: false
      entities:
      - entity: number.mennekes_amtron_energia_ospite
        name: Energia
      - entity: number.mennekes_amtron_durata_massima_ospite
        name: Minuti max.
      - entity: number.mennekes_amtron_corrente_ospite
        name: Corrente
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_bozza_ricarica_ospite
      primary: Bozza
      secondary: >-
        {{ state_translated('sensor.mennekes_amtron_bozza_ricarica_ospite') if has_value('sensor.mennekes_amtron_bozza_ricarica_ospite')
        else 'Non disponibile' }}
      icon: >-
        {{ 'mdi:check-circle-outline' if states('sensor.mennekes_amtron_bozza_ricarica_ospite') in ['reached', 'estimated_reached',
        'finished'] else 'mdi:alert-circle-outline' if states('sensor.mennekes_amtron_bozza_ricarica_ospite') in
        ['error', 'interrupted', 'job_storage_unavailable', 'unavailable'] else 'mdi:account-edit-outline' }}
      color: >-
        {{ 'red' if states('sensor.mennekes_amtron_bozza_ricarica_ospite') in ['error', 'interrupted', 'job_storage_unavailable',
        'unavailable'] else 'green' if states('sensor.mennekes_amtron_bozza_ricarica_ospite') in ['active', 'charging',
        'finishing', 'ready', 'reached', 'estimated_reached'] else 'grey' if states('sensor.mennekes_amtron_bozza_ricarica_ospite')
        in ['disabled', 'none'] else 'amber' }}
      multiline_secondary: true
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_ricarica_ospite
      primary: Stato
      secondary: >-
        {{ state_translated('sensor.mennekes_amtron_ricarica_ospite') if has_value('sensor.mennekes_amtron_ricarica_ospite')
        else 'Non disponibile' }}
      icon: >-
        {{ 'mdi:check-circle-outline' if states('sensor.mennekes_amtron_ricarica_ospite') in ['reached', 'estimated_reached',
        'finished'] else 'mdi:alert-circle-outline' if states('sensor.mennekes_amtron_ricarica_ospite') in ['error',
        'interrupted', 'job_storage_unavailable', 'unavailable'] else 'mdi:account-clock-outline' }}
      color: >-
        {{ 'red' if states('sensor.mennekes_amtron_ricarica_ospite') in ['error', 'interrupted', 'job_storage_unavailable',
        'unavailable'] else 'green' if states('sensor.mennekes_amtron_ricarica_ospite') in ['active', 'charging',
        'finishing', 'ready', 'reached', 'estimated_reached'] else 'grey' if states('sensor.mennekes_amtron_ricarica_ospite')
        in ['disabled', 'none'] else 'amber' }}
      multiline_secondary: true
      tap_action:
        action: more-info
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_avvia_ricarica_ospite
        name: Avvia ospite
        secondary_info: none
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_avvia_ricarica_ospite
          confirmation:
            text: Avviare ospite? Disattivare obiettivo veicolo e verificare abilitazione.
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_ferma_ricarica_ospite
        name: Arresta
        secondary_info: none
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_ferma_ricarica_ospite
          confirmation:
            text: Fermare ospite e sospendere?
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_rimuovi_ricarica_ospite
        name: Rimuovi
        secondary_info: none
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_rimuovi_ricarica_ospite
          confirmation:
            text: Rimuovere ricarica ospite terminata senza avviare?
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_ripristina_bozza_ospite
        name: Ripristina bozza
        secondary_info: none
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_ripristina_bozza_ospite
          confirmation:
            text: Ripristinare bozza ospite senza modificare la ricarica in corso?
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_bozza_ricarica_ospite
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Ricarica ospite non disponibile
    secondary: Collegare app, abilitare scritture e aggiornare app/integrazione almeno a 0.9.0b7. Verificare ID
      entità.
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
