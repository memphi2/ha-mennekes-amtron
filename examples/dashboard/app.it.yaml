# Una scheda manuale (Mushroom): riquadro di stato e due file di chip. Adattare gli ID se necessario.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_stato_di_ricarica
    primary: "AMTRON · {{ states('sensor.mennekes_amtron_potenza_totale', with_unit=True) if has_value('sensor.mennekes_amtron_potenza_totale') else '—' }}"
    secondary: >-
      {%- set p = namespace(l=[]) -%}
      {%- set e = states('number.mennekes_amtron_obiettivo_energetico') | float(0) -%}
      {%- if e > 0 %}{% set p.l = p.l + ['%g kWh' % e] %}{% endif -%}
      {%- if has_value('datetime.mennekes_amtron_orario_obiettivo') %}{% set p.l = p.l + ['fino alle ' ~ as_local(as_datetime(states('datetime.mennekes_amtron_orario_obiettivo'))).strftime('%H:%M')] %}{% endif -%}
      {%- set s = states('number.mennekes_amtron_obiettivo_di_carica_del_veicolo') | float(0) -%}
      {%- if s > 0 %}{% set p.l = p.l + ['%d %%' % s] %}{% endif -%}
      {%- set t = state_attr('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica', 'departure_plan') -%}
      {{ 'In attesa della prima lettura' if is_state(entity, 'unknown') else 'Connessione interrotta' if is_state(entity, 'unavailable') else state_translated(entity) }} · {{ states('sensor.mennekes_amtron_energia_della_sessione', with_unit=True) if has_value('sensor.mennekes_amtron_energia_della_sessione') else '—' }}

      {{ 'Obiettivi: ' ~ p.l | join(' · ') if p.l else 'Nessun obiettivo' }}
      {%- if t not in [none, 'disabled'] %} · Pianificazione: {{ state_attr_translated('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica', 'departure_plan') }}{% endif %}
    multiline_secondary: true
    icon: mdi:ev-station
    color: >-
      {% set s = states(entity) %}{{ 'green' if s == 'charging' else 'amber' if s == 'paused'
      else 'red' if s in ['wallbox_error', 'unavailable']
      else 'amber' if s in ['state_uncertain', 'data_missing']
      else 'grey' if s in ['unknown', 'checking_status', 'initializing'] else 'blue' }}
    tap_action:
      action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_plug_charge_virtuale
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_plug_charge_virtuale
          content: >-
            {{ 'P&C pronto' if state_attr('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica', 'plug_charge') in ['authorized', 'manual_release']
            else 'P&C in attesa' if is_state(entity, 'on') else 'P&C spento' }}
          icon: mdi:car-key
          icon_color: >-
            {{ 'green' if state_attr('sensor.mennekes_amtron_motivo_di_attesa_della_ricarica', 'plug_charge') in ['authorized', 'manual_release']
            else 'amber' if is_state(entity, 'on') else 'grey' }}
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_veicolo_attivo
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: select.mennekes_amtron_veicolo_attivo
          content: "{{ states(entity) }}"
          icon: mdi:car
          icon_color: green
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_limite_di_corrente_di_ricarica
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: number.mennekes_amtron_limite_di_corrente_di_ricarica
          content: "{{ states(entity) | int(0) }} A"
          icon: mdi:current-ac
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_ricarica_in_pausa
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_ricarica_in_pausa
          content: "{{ 'In pausa' if is_state(entity, 'on') else 'Pausa' }}"
          icon: mdi:pause
          icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
          tap_action:
            action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_consenso_alla_ricarica
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_consenso_alla_ricarica
          content: "{{ 'Consenso' if is_state(entity, 'on') else 'Consenso disattivo' }}"
          icon: "{{ 'mdi:lock-open-variant' if is_state(entity, 'on') else 'mdi:lock' }}"
          icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
          tap_action:
            action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: number.mennekes_amtron_obiettivo_energetico
        content: >-
          {% set e = states(entity) | float(0) %}{{ '%g kWh' % e if e > 0 else 'Obiettivo energetico' }}
        icon: mdi:lightning-bolt
        icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
        tap_action:
          action: more-info
      - type: template
        entity: datetime.mennekes_amtron_orario_obiettivo
        content: >-
          {{ as_local(as_datetime(states(entity))).strftime('%d.%m. %H:%M') if has_value(entity) else 'Orario obiettivo' }}
        icon: mdi:clock-outline
        icon_color: "{{ 'blue' if has_value(entity) else 'grey' }}"
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: mennekes_amtron_rtu.clear_target_time
          target:
            entity_id: datetime.mennekes_amtron_orario_obiettivo
          confirmation:
            text: "Cancellare l’orario obiettivo? Gli altri obiettivi restano."
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_obiettivo_di_carica_del_veicolo
            state_not: unavailable
        chip:
          type: template
          entity: number.mennekes_amtron_obiettivo_di_carica_del_veicolo
          content: >-
            {% set s = states(entity) | float(0) %}{{ '%d %%' % s if s > 0 else 'Obiettivo veicolo' }}
          icon: mdi:battery-charging-80
          icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.mennekes_amtron_ricarica_ospite
            state: "off"
        chip:
          type: template
          content: "Avvia ospite"
          icon: mdi:account-arrow-right
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_avvia_ricarica_ospite
            confirmation:
              text: "Avviare ora la ricarica ospite? Obiettivo energetico, di costo e orario obiettivo la terminano."
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_veicolo_attivo
            state_not: unavailable
        chip:
          type: template
          content: "Calendario"
          icon: mdi:calendar-import
          tap_action:
            action: perform-action
            perform_action: mennekes_amtron_rtu.use_calendar_departure
            confirmation:
              text: "Usare questa partenza? Un piano di partenza può annullare una pausa manuale."
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_veicolo_attivo
            state_not: unavailable
        chip:
          type: template
          content: "Timer veicolo"
          icon: mdi:car-clock
          tap_action:
            action: perform-action
            perform_action: mennekes_amtron_rtu.use_vehicle_departure
            confirmation:
              text: "Usare questa partenza? Un piano di partenza può annullare una pausa manuale."
