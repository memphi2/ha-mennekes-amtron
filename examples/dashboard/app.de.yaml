# Eine manuelle Karte (Mushroom): Statuskachel und zwei Chip-Reihen. Entity-IDs bei Bedarf anpassen.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_ladestatus
    primary: "AMTRON · {{ states('sensor.mennekes_amtron_gesamtleistung', with_unit=True) }}"
    secondary: >-
      {%- set p = namespace(l=[]) -%}
      {%- set e = states('number.mennekes_amtron_ladeziel') | float(0) -%}
      {%- if e > 0 %}{% set p.l = p.l + ['%g kWh' % e] %}{% endif -%}
      {%- if has_value('datetime.mennekes_amtron_zielzeitpunkt') %}{% set p.l = p.l + ['bis ' ~ as_local(as_datetime(states('datetime.mennekes_amtron_zielzeitpunkt'))).strftime('%H:%M')] %}{% endif -%}
      {%- set s = states('number.mennekes_amtron_fahrzeug_ladeziel') | float(0) -%}
      {%- if s > 0 %}{% set p.l = p.l + ['%d %%' % s] %}{% endif -%}
      {%- set t = states('sensor.mennekes_amtron_status_des_zeitgesteuerten_ladens') -%}
      {{ state_translated(entity) }} · {{ states('sensor.mennekes_amtron_energie_der_sitzung', with_unit=True) }}

      {{ 'Grenzen: ' ~ p.l | join(' · ') if p.l else 'Keine Ladegrenze' }}
      {%- if t not in ['disabled', 'none', 'unknown', 'unavailable'] %} · Planung: {{ state_translated('sensor.mennekes_amtron_status_des_zeitgesteuerten_ladens') }}{% endif %}
    multiline_secondary: true
    icon: mdi:ev-station
    color: >-
      {% set s = states(entity) %}{{ 'green' if s == 'charging' else 'amber' if s == 'paused'
      else 'red' if s in ['wallbox_error', 'unavailable', 'unknown'] else 'blue' }}
    tap_action:
      action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_virtuelles_plug_charge
            state_not: unavailable
        chip:
          type: template
          entity: switch.mennekes_amtron_virtuelles_plug_charge
          content: >-
            {{ 'P&C bereit' if states('sensor.mennekes_amtron_status_von_virtuellem_plug_charge') in ['authorized', 'manual_release']
            else 'P&C wartet' if is_state(entity, 'on') else 'P&C aus' }}
          icon: mdi:car-key
          icon_color: >-
            {{ 'green' if states('sensor.mennekes_amtron_status_von_virtuellem_plug_charge') in ['authorized', 'manual_release']
            else 'amber' if is_state(entity, 'on') else 'grey' }}
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_aktives_fahrzeug
            state_not: unavailable
        chip:
          type: template
          entity: select.mennekes_amtron_aktives_fahrzeug
          content: "{{ states(entity) }}"
          icon: mdi:car
          icon_color: green
          tap_action:
            action: more-info
      - type: template
        entity: number.mennekes_amtron_ladestrom_begrenzung
        content: "{{ states(entity) | int(0) }} A"
        icon: mdi:current-ac
        tap_action:
          action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_laden_pausiert
            state_not: unavailable
        chip:
          type: template
          entity: switch.mennekes_amtron_laden_pausiert
          content: "{{ 'Pausiert' if is_state(entity, 'on') else 'Pause' }}"
          icon: mdi:pause
          icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
          tap_action:
            action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_ladefreigabe
            state_not: unavailable
        chip:
          type: template
          entity: switch.mennekes_amtron_ladefreigabe
          content: "{{ 'Freigabe' if is_state(entity, 'on') else 'Freigabe aus' }}"
          icon: "{{ 'mdi:lock-open-variant' if is_state(entity, 'on') else 'mdi:lock' }}"
          icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
          tap_action:
            action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: number.mennekes_amtron_ladeziel
        content: >-
          {% set e = states(entity) | float(0) %}{{ '%g kWh' % e if e > 0 else 'kWh-Ziel' }}
        icon: mdi:lightning-bolt
        icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
        tap_action:
          action: more-info
      - type: template
        entity: datetime.mennekes_amtron_zielzeitpunkt
        content: >-
          {{ as_local(as_datetime(states(entity))).strftime('%d.%m. %H:%M') if has_value(entity) else 'Zielzeit' }}
        icon: mdi:clock-outline
        icon_color: "{{ 'blue' if has_value(entity) else 'grey' }}"
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: mennekes_amtron_rtu.clear_target_time
          target:
            entity_id: datetime.mennekes_amtron_zielzeitpunkt
          confirmation:
            text: "Zielzeit löschen? kWh- und Prozentziel bleiben."
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_fahrzeug_ladeziel
            state_not: unavailable
        chip:
          type: template
          entity: number.mennekes_amtron_fahrzeug_ladeziel
          content: >-
            {% set s = states(entity) | float(0) %}{{ '%d %%' % s if s > 0 else '%-Ziel' }}
          icon: mdi:battery-charging-80
          icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.mennekes_amtron_gastladen
            state: inactive
        chip:
          type: template
          content: "Gast starten"
          icon: mdi:account-arrow-right
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_gastladen_starten
            confirmation:
              text: "Gastladen jetzt starten? Es gelten kWh-Ziel und Zielzeit."
      - type: conditional
        conditions:
          - condition: state
            entity: button.mennekes_amtron_nachsten_kalendertermin_ubernehmen
            state_not: unavailable
        chip:
          type: template
          content: "Kalender"
          icon: mdi:calendar-import
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_nachsten_kalendertermin_ubernehmen
            confirmation:
              text: "Abfahrt übernehmen? Ein Abfahrtsplan darf eine manuelle Pause aufheben."
      - type: conditional
        conditions:
          - condition: state
            entity: button.mennekes_amtron_abfahrt_vom_fahrzeug_ubernehmen
            state_not: unavailable
        chip:
          type: template
          content: "Fahrzeugtimer"
          icon: mdi:car-clock
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_abfahrt_vom_fahrzeug_ubernehmen
            confirmation:
              text: "Abfahrt übernehmen? Ein Abfahrtsplan darf eine manuelle Pause aufheben."
