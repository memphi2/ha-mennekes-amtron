# Paste into a Manual card. Check entity IDs first. No helpers or scripts required.
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_charging_status
  icon: mdi:ev-station
  primary: >-
    AMTRON · {{ states('sensor.mennekes_amtron_total_power', with_unit=True) if has_value('sensor.mennekes_amtron_total_power')
    else '—' }}
  secondary: |-
    {{ state_translated('sensor.mennekes_amtron_charging_status') if has_value('sensor.mennekes_amtron_charging_status') else 'Status unavailable' }}
    Session: {{ states('sensor.mennekes_amtron_session_energy', with_unit=True) if has_value('sensor.mennekes_amtron_session_energy') else '—' }}
  multiline_secondary: true
  color: >-
    {{ 'green' if is_state('sensor.mennekes_amtron_charging_status', 'charging') else 'red' if is_state('sensor.mennekes_amtron_charging_status',
    'wallbox_error') or not has_value('sensor.mennekes_amtron_charging_status') else 'amber' if is_state('sensor.mennekes_amtron_charging_status',
    'paused') else 'blue' }}
  tap_action:
    action: more-info
- type: custom:mushroom-number-card
  entity: number.mennekes_amtron_charging_current_limit
  name: Current limit
  icon: mdi:current-ac
  display_mode: slider
  layout: horizontal
- type: custom:mushroom-chips-card
  alignment: center
  chips:
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_charging_paused
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: switch.mennekes_amtron_charging_paused
      name: Pause
      content_info: name
      icon: mdi:pause-circle
      tap_action:
        action: toggle
      hold_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_charging_release
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: switch.mennekes_amtron_charging_release
      name: Release
      content_info: name
      icon: mdi:ev-plug-type2
      tap_action:
        action: more-info
      hold_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_virtual_plug_charge
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: switch.mennekes_amtron_virtual_plug_charge
      name: Plug & Charge
      content_info: name
      icon: mdi:car-key
      tap_action:
        action: more-info
      hold_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: select.mennekes_amtron_active_vehicle
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: select.mennekes_amtron_active_vehicle
      name: Vehicle
      content_info: name
      icon: mdi:car-multiple
      tap_action:
        action: more-info
- type: custom:mushroom-title-card
  subtitle: 0 A removes the limit · use Pause to pause
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_charging_wait_reason
    state_not:
    - unknown
    - unavailable
  - condition: state
    entity: sensor.mennekes_amtron_charging_wait_reason
    state_not:
    - none
    - no_vehicle
  card:
    type: custom:mushroom-entity-card
    entity: sensor.mennekes_amtron_charging_wait_reason
    name: Charging control
    tap_action:
      action: more-info
    layout: horizontal
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_charging_job_draft
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-entity-card
      entity: sensor.mennekes_amtron_charging_job
      name: Charging job
      tap_action:
        action: more-info
      layout: horizontal
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-number-card
        entity: number.mennekes_amtron_job_current
        name: Current
        display_mode: buttons
      - type: custom:mushroom-number-card
        entity: number.mennekes_amtron_job_energy
        name: Energy
        display_mode: buttons
    - type: entities
      show_header_toggle: false
      entities:
      - entity: datetime.mennekes_amtron_job_latest_finish
        name: Finish by
    - type: custom:mushroom-entity-card
      entity: sensor.mennekes_amtron_charging_job_draft
      name: Draft
      tap_action:
        action: more-info
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_start_charging_job
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_start_charging_job
          confirmation:
            text: Start the saved draft?
        name: Start
        secondary_info: none
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_stop_charging_job
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_stop_charging_job
          confirmation:
            text: Stop the job and pause charging?
        name: Stop
        secondary_info: none
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_clear_charging_job
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_clear_charging_job
          confirmation:
            text: Clear the ended job without starting charging?
        name: Clear
        secondary_info: none
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_reset_job_draft
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_reset_job_draft
          confirmation:
            text: Reset draft values? The current job is unchanged.
        name: Reset
        secondary_info: none
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity: sensor.mennekes_amtron_charging_job_draft
      state:
      - unknown
      - unavailable
  card:
    type: custom:mushroom-template-card
    icon: mdi:information-outline
    color: amber
    primary: Charging job unavailable
    secondary: Update app and integration to at least 0.9.0b6. Check app connection and entity IDs.
    multiline_secondary: true
    tap_action:
      action: none
