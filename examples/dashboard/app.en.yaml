# One manual card (Mushroom): status tile and two chip rows. Adjust entity IDs if needed.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_charging_status
    primary: "AMTRON · {{ states('sensor.mennekes_amtron_total_power', with_unit=True) if has_value('sensor.mennekes_amtron_total_power') else '—' }}"
    secondary: >-
      {%- set p = namespace(l=[]) -%}
      {%- set e = states('number.mennekes_amtron_energy_target') | float(0) -%}
      {%- if e > 0 %}{% set p.l = p.l + ['%g kWh' % e] %}{% endif -%}
      {%- if has_value('datetime.mennekes_amtron_target_time') %}{% set p.l = p.l + ['until ' ~ as_local(as_datetime(states('datetime.mennekes_amtron_target_time'))).strftime('%H:%M')] %}{% endif -%}
      {%- set s = states('number.mennekes_amtron_vehicle_charge_target') | float(0) -%}
      {%- if s > 0 %}{% set p.l = p.l + ['%d %%' % s] %}{% endif -%}
      {%- set t = state_attr('sensor.mennekes_amtron_charging_wait_reason', 'departure_plan') -%}
      {{ 'Waiting for first reading' if is_state(entity, 'unknown') else 'Connection interrupted' if is_state(entity, 'unavailable') else state_translated(entity) }} · {{ states('sensor.mennekes_amtron_session_energy', with_unit=True) if has_value('sensor.mennekes_amtron_session_energy') else '—' }}

      {{ 'Targets: ' ~ p.l | join(' · ') if p.l else 'No target' }}
      {%- if t not in [none, 'disabled'] %} · Planning: {{ state_attr_translated('sensor.mennekes_amtron_charging_wait_reason', 'departure_plan') }}{% endif %}
    multiline_secondary: true
    icon: mdi:ev-station
    color: >-
      {% set s = states(entity) %}{{ 'green' if s == 'charging' else 'amber' if s == 'paused'
      else 'red' if s in ['wallbox_error', 'unavailable']
      else 'amber' if s in ['state_uncertain', 'data_missing']
      else 'grey' if s in ['unknown', 'checking_status', 'initializing'] else 'blue' }}
    tap_action:
      action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_virtual_plug_charge
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_virtual_plug_charge
          content: >-
            {{ 'P&C ready' if state_attr('sensor.mennekes_amtron_charging_wait_reason', 'plug_charge') in ['authorized', 'manual_release']
            else 'P&C waiting' if is_state(entity, 'on') else 'P&C off' }}
          icon: mdi:car-key
          icon_color: >-
            {{ 'green' if state_attr('sensor.mennekes_amtron_charging_wait_reason', 'plug_charge') in ['authorized', 'manual_release']
            else 'amber' if is_state(entity, 'on') else 'grey' }}
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_active_vehicle
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: select.mennekes_amtron_active_vehicle
          content: "{{ states(entity) }}"
          icon: mdi:car
          icon_color: green
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_charging_current_limit
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: number.mennekes_amtron_charging_current_limit
          content: "{{ states(entity) | int(0) }} A"
          icon: mdi:current-ac
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_charging_paused
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_charging_paused
          content: "{{ 'Paused' if is_state(entity, 'on') else 'Pause' }}"
          icon: mdi:pause
          icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
          tap_action:
            action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_charging_release
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_charging_release
          content: "{{ 'Release' if is_state(entity, 'on') else 'Release off' }}"
          icon: "{{ 'mdi:lock-open-variant' if is_state(entity, 'on') else 'mdi:lock' }}"
          icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
          tap_action:
            action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: number.mennekes_amtron_energy_target
        content: >-
          {% set e = states(entity) | float(0) %}{{ '%g kWh' % e if e > 0 else 'Energy target' }}
        icon: mdi:lightning-bolt
        icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
        tap_action:
          action: more-info
      - type: template
        entity: datetime.mennekes_amtron_target_time
        content: >-
          {{ as_local(as_datetime(states(entity))).strftime('%d.%m. %H:%M') if has_value(entity) else 'Target time' }}
        icon: mdi:clock-outline
        icon_color: "{{ 'blue' if has_value(entity) else 'grey' }}"
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: mennekes_amtron_rtu.clear_target_time
          target:
            entity_id: datetime.mennekes_amtron_target_time
          confirmation:
            text: "Clear the target time? The other targets stay."
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_vehicle_charge_target
            state_not: unavailable
        chip:
          type: template
          entity: number.mennekes_amtron_vehicle_charge_target
          content: >-
            {% set s = states(entity) | float(0) %}{{ '%d %%' % s if s > 0 else 'Vehicle target' }}
          icon: mdi:battery-charging-80
          icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.mennekes_amtron_guest_charging
            state: "off"
        chip:
          type: template
          content: "Start guest"
          icon: mdi:account-arrow-right
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_start_guest_charging
            confirmation:
              text: "Start guest charging now? Energy target, cost target and target time end it."
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_active_vehicle
            state_not: unavailable
        chip:
          type: template
          content: "Calendar"
          icon: mdi:calendar-import
          tap_action:
            action: perform-action
            perform_action: mennekes_amtron_rtu.use_calendar_departure
            confirmation:
              text: "Use this departure? A departure plan may lift a manual pause."
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_active_vehicle
            state_not: unavailable
        chip:
          type: template
          content: "Vehicle timer"
          icon: mdi:car-clock
          tap_action:
            action: perform-action
            perform_action: mennekes_amtron_rtu.use_vehicle_departure
            confirmation:
              text: "Use this departure? A departure plan may lift a manual pause."
