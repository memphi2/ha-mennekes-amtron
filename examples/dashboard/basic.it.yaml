# Una scheda manuale con le schede integrate di HA. Verificare gli ID delle entità prima dell’uso.
type: vertical-stack
cards:
- type: entities
  title: Wallbox
  show_header_toggle: false
  entities:
  - sensor.mennekes_amtron_stato_di_ricarica
  - sensor.mennekes_amtron_potenza_totale
  - sensor.mennekes_amtron_energia_della_sessione
  - number.mennekes_amtron_limite_di_corrente_di_ricarica
  - switch.mennekes_amtron_ricarica_in_pausa
  - switch.mennekes_amtron_consenso_alla_ricarica
  - number.mennekes_amtron_obiettivo_energetico
  - type: conditional
    conditions:
    - entity: number.mennekes_amtron_obiettivo_di_costo
      state_not: unavailable
    row:
      entity: number.mennekes_amtron_obiettivo_di_costo
  - datetime.mennekes_amtron_orario_obiettivo
  - type: conditional
    conditions:
    - entity: number.mennekes_amtron_obiettivo_di_carica_del_veicolo
      state_not: unavailable
    row:
      entity: number.mennekes_amtron_obiettivo_di_carica_del_veicolo
  - type: conditional
    conditions:
    - entity: binary_sensor.mennekes_amtron_ricarica_ospite
      state: "off"
    row:
      entity: button.mennekes_amtron_avvia_ricarica_ospite
  - sensor.mennekes_amtron_energia_totale
