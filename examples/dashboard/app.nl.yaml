# Single manual card. Adjust entity IDs for existing or renamed devices.
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_laadstatus
  primary: AMTRON · {{ states('sensor.mennekes_amtron_totaal_vermogen', with_unit=True) if has_value('sensor.mennekes_amtron_totaal_vermogen')
    else '—' }}
  secondary: '{{ state_translated(''sensor.mennekes_amtron_laadstatus'') if has_value(''sensor.mennekes_amtron_laadstatus'')
    else ''Niet beschikbaar'' }}

    Sessie: {{ states(''sensor.mennekes_amtron_energie_laadsessie'', with_unit=True) if has_value(''sensor.mennekes_amtron_energie_laadsessie'')
    else ''—'' }}'
  icon: '{{ ''mdi:ev-station'' if is_state(''sensor.mennekes_amtron_laadstatus'',''charging'') else ''mdi:pause-circle''
    if is_state(''sensor.mennekes_amtron_laadstatus'',''paused'') else ''mdi:alert-circle'' if states(''sensor.mennekes_amtron_laadstatus'')
    in [''wallbox_error'',''unavailable'',''unknown''] else ''mdi:ev-plug-type2'' }}'
  color: '{{ ''green'' if is_state(''sensor.mennekes_amtron_laadstatus'',''charging'') else ''amber'' if is_state(''sensor.mennekes_amtron_laadstatus'',''paused'')
    else ''red'' if states(''sensor.mennekes_amtron_laadstatus'') in [''wallbox_error'',''unavailable'',''unknown'']
    else ''blue'' }}'
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-chips-card
  alignment: center
  chips:
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_laden_gepauzeerd
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_laden_gepauzeerd
      content: '{{ ''Gepauzeerd'' if is_state(''switch.mennekes_amtron_laden_gepauzeerd'',''on'') else ''Pauze''
        }}'
      icon: '{{ ''mdi:pause-circle'' if is_state(''switch.mennekes_amtron_laden_gepauzeerd'',''on'') else ''mdi:play-circle-outline''
        }}'
      icon_color: '{{ ''amber'' if is_state(''switch.mennekes_amtron_laden_gepauzeerd'',''on'') else ''grey'' }}'
      tap_action:
        action: toggle
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_laadvrijgave
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_laadvrijgave
      content: '{{ ''Vrijgegeven'' if is_state(''switch.mennekes_amtron_laadvrijgave'',''on'') else ''Vrijgave uit''
        }}'
      icon: '{{ ''mdi:power-plug'' if is_state(''switch.mennekes_amtron_laadvrijgave'',''on'') else ''mdi:power-plug-off''
        }}'
      icon_color: '{{ ''green'' if is_state(''switch.mennekes_amtron_laadvrijgave'',''on'') else ''grey'' }}'
      tap_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_virtuele_plug_charge
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_virtuele_plug_charge
      content: '{{ ''P&C uit'' if is_state(''switch.mennekes_amtron_virtuele_plug_charge'',''off'') else ''P&C gereed''
        if states(''sensor.mennekes_amtron_status_virtuele_plug_charge'') in [''authorized'',''manual_release'']
        else ''P&C wacht'' }}'
      icon: '{{ ''mdi:car-key'' if states(''sensor.mennekes_amtron_status_virtuele_plug_charge'') in [''authorized'',''manual_release'']
        else ''mdi:car-clock'' if is_state(''switch.mennekes_amtron_virtuele_plug_charge'',''on'') else ''mdi:car-off''
        }}'
      icon_color: '{{ ''grey'' if is_state(''switch.mennekes_amtron_virtuele_plug_charge'',''off'') else ''green''
        if states(''sensor.mennekes_amtron_status_virtuele_plug_charge'') in [''authorized'',''manual_release'']
        else ''amber'' }}'
      tap_action:
        action: more-info
  - type: entity
    entity: select.mennekes_amtron_actief_voertuig
    name: Voertuig
    content_info: state
    icon: mdi:car-multiple
    tap_action:
      action: more-info
- type: custom:mushroom-number-card
  entity: number.mennekes_amtron_laadstroomlimiet
  name: Stroomlimiet
  display_mode: slider
- type: custom:mushroom-title-card
  title: Laadgrenzen
  subtitle: 'Optioneel: kWh, tijdstip en voertuiglaadniveau. De eerst bereikte grens stopt het laden.'
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_energiedoel
    state_not:
    - unknown
    - unavailable
  card:
    type: entities
    show_header_toggle: false
    entities:
    - entity: number.mennekes_amtron_energiedoel
      name: Extra energie
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity: sensor.mennekes_amtron_gastladen
      state_not:
      - unknown
      - unavailable
    - condition: state
      entity: sensor.mennekes_amtron_status_geplande_lading
      state_not:
      - unknown
      - unavailable
  card:
    type: custom:mushroom-template-card
    entity: datetime.mennekes_amtron_doeltijd
    primary: Doeltijd
    secondary: '{{ as_local(as_datetime(states(''datetime.mennekes_amtron_doeltijd''))).strftime(''%d/%m/%Y %H:%M'')
      if has_value(''datetime.mennekes_amtron_doeltijd'') else ''Niet ingesteld'' }}

      Tik om te wijzigen · Houd vast om te wissen'
    icon: mdi:calendar-clock
    color: blue
    multiline_secondary: true
    tap_action:
      action: more-info
    hold_action:
      action: perform-action
      perform_action: mennekes_amtron_rtu.clear_target_time
      target:
        entity_id: datetime.mennekes_amtron_doeltijd
      confirmation:
        text: Tijd wissen? Andere doelen blijven ongewijzigd.
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_laaddoel_van_voertuig
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-number-card
      entity: number.mennekes_amtron_laaddoel_van_voertuig
      name: Doelniveau
      display_mode: slider
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_gastladen
    state: inactive
  card:
    type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_gastladen
    primary: Gastladen starten
    secondary: Start direct met de opgeslagen kWh- en tijdslimieten.
    multiline_secondary: true
    icon: mdi:account-arrow-right
    color: blue
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.mennekes_amtron_gastladen_starten
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_gastladen
    state: active
  card:
    type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_gastladen
    primary: Gastladen stoppen
    secondary: Gasttoestemming actief · Tik om te pauzeren
    multiline_secondary: true
    icon: mdi:pause-circle
    color: green
    tap_action:
      action: perform-action
      perform_action: switch.turn_on
      target:
        entity_id: switch.mennekes_amtron_laden_gepauzeerd
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_status_geplande_lading
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Voertuigplanning
      subtitle: Plant met voertuiggegevens en werkelijk geleverd vermogen.
    - type: custom:mushroom-chips-card
      chips:
      - type: entity
        entity: button.mennekes_amtron_volgende_agenda_afspraak_gebruiken
        name: Kalender
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_volgende_agenda_afspraak_gebruiken
          confirmation:
            text: Toepassen? Een vertrekplan mag een handmatige pauze opheffen.
      - type: entity
        entity: button.mennekes_amtron_vertrektijd_van_voertuig_overnemen
        name: Voertuigtimer
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_vertrektijd_van_voertuig_overnemen
          confirmation:
            text: Toepassen? Een vertrekplan mag een handmatige pauze opheffen.
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_status_geplande_lading
      primary: Status
      secondary: '{{ state_translated(''sensor.mennekes_amtron_status_geplande_lading'') if has_value(''sensor.mennekes_amtron_status_geplande_lading'')
        else ''Niet beschikbaar'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_status_geplande_lading'') in [''reached'',
        ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_status_geplande_lading'')
        in [''error'', ''interrupted'', ''unavailable''] else ''mdi:car-clock'' }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_status_geplande_lading'') in [''error'', ''interrupted'',
        ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_status_geplande_lading'')
        in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey''
        if states(''sensor.mennekes_amtron_status_geplande_lading'') in [''disabled'', ''none''] else ''amber''
        }}'
      multiline_secondary: true
      tap_action:
        action: more-info
