# Manual card. Check the translated entity IDs. No helpers or scripts.
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_laadstatus
  primary: AMTRON · {{ states('sensor.mennekes_amtron_totaal_vermogen', with_unit=True) if has_value('sensor.mennekes_amtron_totaal_vermogen')
    else '—' }}
  secondary: '{{ state_translated(''sensor.mennekes_amtron_laadstatus'') if has_value(''sensor.mennekes_amtron_laadstatus'')
    else ''Niet beschikbaar'' }}

    Sessie: {{ states(''sensor.mennekes_amtron_energie_laadsessie'', with_unit=True) if has_value(''sensor.mennekes_amtron_energie_laadsessie'')
    else ''—'' }}'
  icon: '{{ ''mdi:ev-station'' if is_state(''sensor.mennekes_amtron_laadstatus'',''charging'') else ''mdi:pause-circle''
    if is_state(''sensor.mennekes_amtron_laadstatus'',''paused'') else ''mdi:alert-circle'' if states(''sensor.mennekes_amtron_laadstatus'')
    in [''wallbox_error'',''unavailable'',''unknown''] else ''mdi:ev-plug-type2'' }}'
  color: '{{ ''green'' if is_state(''sensor.mennekes_amtron_laadstatus'',''charging'') else ''amber'' if is_state(''sensor.mennekes_amtron_laadstatus'',''paused'')
    else ''red'' if states(''sensor.mennekes_amtron_laadstatus'') in [''wallbox_error'',''unavailable'',''unknown'']
    else ''blue'' }}'
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-number-card
  entity: number.mennekes_amtron_laadstroomlimiet
  name: Stroomlimiet
  display_mode: slider
- type: custom:mushroom-chips-card
  alignment: center
  chips:
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_laden_gepauzeerd
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_laden_gepauzeerd
      content: '{{ ''Gepauzeerd'' if is_state(''switch.mennekes_amtron_laden_gepauzeerd'',''on'') else ''Pauze''
        }}'
      icon: '{{ ''mdi:pause-circle'' if is_state(''switch.mennekes_amtron_laden_gepauzeerd'',''on'') else ''mdi:play-circle-outline''
        }}'
      icon_color: '{{ ''amber'' if is_state(''switch.mennekes_amtron_laden_gepauzeerd'',''on'') else ''grey'' }}'
      tap_action:
        action: toggle
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_laadvrijgave
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_laadvrijgave
      content: '{{ ''Vrijgegeven'' if is_state(''switch.mennekes_amtron_laadvrijgave'',''on'') else ''Vrijgave uit''
        }}'
      icon: '{{ ''mdi:power-plug'' if is_state(''switch.mennekes_amtron_laadvrijgave'',''on'') else ''mdi:power-plug-off''
        }}'
      icon_color: '{{ ''green'' if is_state(''switch.mennekes_amtron_laadvrijgave'',''on'') else ''grey'' }}'
      tap_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_virtuele_plug_charge
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_virtuele_plug_charge
      content: '{{ ''P&C uit'' if is_state(''switch.mennekes_amtron_virtuele_plug_charge'',''off'') else ''P&C gereed''
        if states(''sensor.mennekes_amtron_status_virtuele_plug_charge'') in [''authorized'',''manual_release'']
        else ''P&C wacht'' }}'
      icon: '{{ ''mdi:car-key'' if states(''sensor.mennekes_amtron_status_virtuele_plug_charge'') in [''authorized'',''manual_release'']
        else ''mdi:car-clock'' if is_state(''switch.mennekes_amtron_virtuele_plug_charge'',''on'') else ''mdi:car-off''
        }}'
      icon_color: '{{ ''grey'' if is_state(''switch.mennekes_amtron_virtuele_plug_charge'',''off'') else ''green''
        if states(''sensor.mennekes_amtron_status_virtuele_plug_charge'') in [''authorized'',''manual_release'']
        else ''amber'' }}'
      tap_action:
        action: more-info
  - type: entity
    entity: select.mennekes_amtron_actief_voertuig
    name: Voertuig
    content_info: state
    icon: mdi:car-multiple
    tap_action:
      action: more-info
- type: custom:mushroom-title-card
  title: ''
  subtitle: 0 A verwijdert de limiet; pauzeer via Pauze.
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity: button.mennekes_amtron_gastladen_starten
      state_not:
      - unknown
      - unavailable
    - condition: state
      entity: sensor.mennekes_amtron_status_geplande_lading
      state_not:
      - unknown
      - unavailable
  card:
    type: custom:mushroom-template-card
    entity: datetime.mennekes_amtron_doeltijd
    primary: Doeltijd
    secondary: '{{ as_local(as_datetime(states(''datetime.mennekes_amtron_doeltijd''))).strftime(''%d/%m/%Y %H:%M'')
      if has_value(''datetime.mennekes_amtron_doeltijd'') else ''Niet ingesteld'' }}

      Tik om te wijzigen · Houd vast om te wissen'
    icon: mdi:calendar-clock
    color: blue
    multiline_secondary: true
    tap_action:
      action: more-info
    hold_action:
      action: perform-action
      perform_action: mennekes_amtron_rtu.clear_target_time
      target:
        entity_id: datetime.mennekes_amtron_doeltijd
      confirmation:
        text: Tijd wissen? Andere doelen blijven ongewijzigd.
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_wachtreden_bij_het_laden
  primary: Status
  secondary: '{{ state_translated(''sensor.mennekes_amtron_wachtreden_bij_het_laden'') if has_value(''sensor.mennekes_amtron_wachtreden_bij_het_laden'')
    else ''Niet beschikbaar'' }}'
  icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_wachtreden_bij_het_laden'') in [''reached'',
    ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_wachtreden_bij_het_laden'')
    in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:timer-sand'' }}'
  color: '{{ ''red'' if states(''sensor.mennekes_amtron_wachtreden_bij_het_laden'') in [''error'', ''interrupted'',
    ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_wachtreden_bij_het_laden'')
    in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey'' if
    states(''sensor.mennekes_amtron_wachtreden_bij_het_laden'') in [''disabled'', ''none''] else ''amber'' }}'
  multiline_secondary: true
  tap_action:
    action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_energiedoel
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Laaddoel
      subtitle: Extra kWh of voertuigpercentage. Alleen begrenzen, niet starten. 0 schakelt de grens uit.
    - type: entities
      show_header_toggle: false
      entities:
      - entity: number.mennekes_amtron_energiedoel
        name: Extra energie
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_status_energiedoel
      primary: Extra energie
      secondary: '{{ state_translated(''sensor.mennekes_amtron_status_energiedoel'') if has_value(''sensor.mennekes_amtron_status_energiedoel'')
        else ''Niet beschikbaar'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_status_energiedoel'') in [''reached'',
        ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_status_energiedoel'')
        in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:lightning-bolt''
        }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_status_energiedoel'') in [''error'', ''interrupted'',
        ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_status_energiedoel'')
        in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey''
        if states(''sensor.mennekes_amtron_status_energiedoel'') in [''disabled'', ''none''] else ''amber'' }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_laaddoel_van_voertuig
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-number-card
      entity: number.mennekes_amtron_laaddoel_van_voertuig
      name: Doelniveau
      display_mode: slider
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_status_van_laaddoel_van_voertuig
      primary: Doelniveau
      secondary: '{{ state_translated(''sensor.mennekes_amtron_status_van_laaddoel_van_voertuig'') if has_value(''sensor.mennekes_amtron_status_van_laaddoel_van_voertuig'')
        else ''Niet beschikbaar'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_status_van_laaddoel_van_voertuig'')
        in [''reached'', ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_status_van_laaddoel_van_voertuig'')
        in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:battery-arrow-up-outline''
        }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_status_van_laaddoel_van_voertuig'') in [''error'', ''interrupted'',
        ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_status_van_laaddoel_van_voertuig'')
        in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey''
        if states(''sensor.mennekes_amtron_status_van_laaddoel_van_voertuig'') in [''disabled'', ''none''] else
        ''amber'' }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_laaddoel_van_voertuig
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Optioneel voertuigdoel
    secondary: 'Configureren → Voertuigen: stel een bron voor accuniveau in.'
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_status_geplande_lading
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Vertrek plannen
      subtitle: Eén vertrek. Vereist accuniveau en bruikbare capaciteit. Mag een handmatige pauze opheffen.
    - type: custom:mushroom-chips-card
      chips:
      - type: entity
        entity: button.mennekes_amtron_volgende_agenda_afspraak_gebruiken
        name: Kalender
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_volgende_agenda_afspraak_gebruiken
          confirmation:
            text: Toepassen? Een vertrekplan mag een handmatige pauze opheffen.
      - type: entity
        entity: button.mennekes_amtron_vertrektijd_van_voertuig_overnemen
        name: Voertuigtimer
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_vertrektijd_van_voertuig_overnemen
          confirmation:
            text: Toepassen? Een vertrekplan mag een handmatige pauze opheffen.
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_status_geplande_lading
      primary: Status
      secondary: '{{ state_translated(''sensor.mennekes_amtron_status_geplande_lading'') if has_value(''sensor.mennekes_amtron_status_geplande_lading'')
        else ''Niet beschikbaar'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_status_geplande_lading'') in [''reached'',
        ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_status_geplande_lading'')
        in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:car-clock'' }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_status_geplande_lading'') in [''error'', ''interrupted'',
        ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_status_geplande_lading'')
        in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey''
        if states(''sensor.mennekes_amtron_status_geplande_lading'') in [''disabled'', ''none''] else ''amber''
        }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_status_geplande_lading
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Optionele vertrekplanning
    secondary: 'Configureren → Voertuigen → Volgend vertrek: activeren en bruikbare capaciteit invullen.'
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: button.mennekes_amtron_gastladen_starten
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Gastladen
      subtitle: Start direct en heft pauze en P&C-beperking voor deze aansluiting op. Opgeslagen kWh- en tijdslimieten
        gelden.
    - type: custom:mushroom-entity-card
      entity: button.mennekes_amtron_gastladen_starten
      name: Gastladen starten
      secondary_info: none
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.mennekes_amtron_gastladen_starten
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_gastladen
      primary: Status
      secondary: '{{ state_translated(''sensor.mennekes_amtron_gastladen'') if has_value(''sensor.mennekes_amtron_gastladen'')
        else ''Niet beschikbaar'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_gastladen'') in [''reached'', ''estimated_reached'',
        ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_gastladen'') in [''error'',
        ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:account-clock-outline'' }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_gastladen'') in [''error'', ''interrupted'', ''job_storage_unavailable'',
        ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_gastladen'') in [''active'', ''charging'',
        ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey'' if states(''sensor.mennekes_amtron_gastladen'')
        in [''disabled'', ''none''] else ''amber'' }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: button.mennekes_amtron_gastladen_starten
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Gastladen niet beschikbaar
    secondary: Verbind de app en schakel schrijven in. Controleer entiteits-ID’s.
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
