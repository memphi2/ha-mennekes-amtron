# Eén handmatige kaart (Mushroom): statustegel en twee rijen chips. Pas entiteit-ID's zo nodig aan.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_laadstatus
    primary: "AMTRON · {{ states('sensor.mennekes_amtron_totaal_vermogen', with_unit=True) }}"
    secondary: >-
      {%- set p = namespace(l=[]) -%}
      {%- set e = states('number.mennekes_amtron_energiedoel') | float(0) -%}
      {%- if e > 0 %}{% set p.l = p.l + ['%g kWh' % e] %}{% endif -%}
      {%- if has_value('datetime.mennekes_amtron_doeltijd') %}{% set p.l = p.l + ['tot ' ~ as_local(as_datetime(states('datetime.mennekes_amtron_doeltijd'))).strftime('%H:%M')] %}{% endif -%}
      {%- set s = states('number.mennekes_amtron_laaddoel_van_voertuig') | float(0) -%}
      {%- if s > 0 %}{% set p.l = p.l + ['%d %%' % s] %}{% endif -%}
      {%- set t = states('sensor.mennekes_amtron_status_geplande_lading') -%}
      {{ state_translated(entity) }} · {{ states('sensor.mennekes_amtron_energie_laadsessie', with_unit=True) }}

      {{ 'Grenzen: ' ~ p.l | join(' · ') if p.l else 'Geen laadgrens' }}
      {%- if t not in ['disabled', 'none', 'unknown', 'unavailable'] %} · Planning: {{ state_translated('sensor.mennekes_amtron_status_geplande_lading') }}{% endif %}
    multiline_secondary: true
    icon: mdi:ev-station
    color: >-
      {% set s = states(entity) %}{{ 'green' if s == 'charging' else 'amber' if s == 'paused'
      else 'red' if s in ['wallbox_error', 'unavailable', 'unknown'] else 'blue' }}
    tap_action:
      action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_virtuele_plug_charge
            state_not: unavailable
        chip:
          type: template
          entity: switch.mennekes_amtron_virtuele_plug_charge
          content: >-
            {{ 'P&C klaar' if states('sensor.mennekes_amtron_status_virtuele_plug_charge') in ['authorized', 'manual_release']
            else 'P&C wacht' if is_state(entity, 'on') else 'P&C uit' }}
          icon: mdi:car-key
          icon_color: >-
            {{ 'green' if states('sensor.mennekes_amtron_status_virtuele_plug_charge') in ['authorized', 'manual_release']
            else 'amber' if is_state(entity, 'on') else 'grey' }}
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_actief_voertuig
            state_not: unavailable
        chip:
          type: template
          entity: select.mennekes_amtron_actief_voertuig
          content: "{{ states(entity) }}"
          icon: mdi:car
          icon_color: green
          tap_action:
            action: more-info
      - type: template
        entity: number.mennekes_amtron_laadstroomlimiet
        content: "{{ states(entity) | int(0) }} A"
        icon: mdi:current-ac
        tap_action:
          action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_laden_gepauzeerd
            state_not: unavailable
        chip:
          type: template
          entity: switch.mennekes_amtron_laden_gepauzeerd
          content: "{{ 'Gepauzeerd' if is_state(entity, 'on') else 'Pauze' }}"
          icon: mdi:pause
          icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
          tap_action:
            action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_laadvrijgave
            state_not: unavailable
        chip:
          type: template
          entity: switch.mennekes_amtron_laadvrijgave
          content: "{{ 'Vrijgave' if is_state(entity, 'on') else 'Vrijgave uit' }}"
          icon: "{{ 'mdi:lock-open-variant' if is_state(entity, 'on') else 'mdi:lock' }}"
          icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
          tap_action:
            action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: number.mennekes_amtron_energiedoel
        content: >-
          {% set e = states(entity) | float(0) %}{{ '%g kWh' % e if e > 0 else 'kWh-doel' }}
        icon: mdi:lightning-bolt
        icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
        tap_action:
          action: more-info
      - type: template
        entity: datetime.mennekes_amtron_doeltijd
        content: >-
          {{ as_local(as_datetime(states(entity))).strftime('%d.%m. %H:%M') if has_value(entity) else 'Doeltijd' }}
        icon: mdi:clock-outline
        icon_color: "{{ 'blue' if has_value(entity) else 'grey' }}"
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: mennekes_amtron_rtu.clear_target_time
          target:
            entity_id: datetime.mennekes_amtron_doeltijd
          confirmation:
            text: "Doeltijd wissen? kWh- en procentdoel blijven."
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_laaddoel_van_voertuig
            state_not: unavailable
        chip:
          type: template
          entity: number.mennekes_amtron_laaddoel_van_voertuig
          content: >-
            {% set s = states(entity) | float(0) %}{{ '%d %%' % s if s > 0 else '%-doel' }}
          icon: mdi:battery-charging-80
          icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.mennekes_amtron_gastladen
            state: inactive
        chip:
          type: template
          content: "Gast starten"
          icon: mdi:account-arrow-right
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_gastladen_starten
            confirmation:
              text: "Gastladen nu starten? kWh-doel en doeltijd gelden."
      - type: conditional
        conditions:
          - condition: state
            entity: button.mennekes_amtron_volgende_agenda_afspraak_gebruiken
            state_not: unavailable
        chip:
          type: template
          content: "Agenda"
          icon: mdi:calendar-import
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_volgende_agenda_afspraak_gebruiken
            confirmation:
              text: "Dit vertrek gebruiken? Een vertrekplan mag een handmatige pauze opheffen."
      - type: conditional
        conditions:
          - condition: state
            entity: button.mennekes_amtron_vertrektijd_van_voertuig_overnemen
            state_not: unavailable
        chip:
          type: template
          content: "Voertuigtimer"
          icon: mdi:car-clock
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_vertrektijd_van_voertuig_overnemen
            confirmation:
              text: "Dit vertrek gebruiken? Een vertrekplan mag een handmatige pauze opheffen."
