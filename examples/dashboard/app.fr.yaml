# Une carte manuelle (Mushroom) : tuile d’état et deux rangées de puces. Adaptez les ID si nécessaire.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_etat_de_la_recharge
    primary: "AMTRON · {{ states('sensor.mennekes_amtron_puissance_totale', with_unit=True) }}"
    secondary: >-
      {%- set p = namespace(l=[]) -%}
      {%- set e = states('number.mennekes_amtron_objectif_energetique') | float(0) -%}
      {%- if e > 0 %}{% set p.l = p.l + ['%g kWh' % e] %}{% endif -%}
      {%- if has_value('datetime.mennekes_amtron_heure_cible') %}{% set p.l = p.l + ['jusqu’à ' ~ as_local(as_datetime(states('datetime.mennekes_amtron_heure_cible'))).strftime('%H:%M')] %}{% endif -%}
      {%- set s = states('number.mennekes_amtron_objectif_de_charge_du_vehicule') | float(0) -%}
      {%- if s > 0 %}{% set p.l = p.l + ['%d %%' % s] %}{% endif -%}
      {%- set t = states('sensor.mennekes_amtron_etat_de_la_charge_programmee') -%}
      {{ state_translated(entity) }} · {{ states('sensor.mennekes_amtron_energie_de_la_session', with_unit=True) }}

      {{ 'Limites: ' ~ p.l | join(' · ') if p.l else 'Aucune limite' }}
      {%- if t not in ['disabled', 'none', 'unknown', 'unavailable'] %} · Planification: {{ state_translated('sensor.mennekes_amtron_etat_de_la_charge_programmee') }}{% endif %}
    multiline_secondary: true
    icon: mdi:ev-station
    color: >-
      {% set s = states(entity) %}{{ 'green' if s == 'charging' else 'amber' if s == 'paused'
      else 'red' if s in ['wallbox_error', 'unavailable', 'unknown'] else 'blue' }}
    tap_action:
      action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_plug_charge_virtuel
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_plug_charge_virtuel
          content: >-
            {{ 'P&C prêt' if states('sensor.mennekes_amtron_etat_de_plug_charge_virtuel') in ['authorized', 'manual_release']
            else 'P&C en attente' if is_state(entity, 'on') else 'P&C coupé' }}
          icon: mdi:car-key
          icon_color: >-
            {{ 'green' if states('sensor.mennekes_amtron_etat_de_plug_charge_virtuel') in ['authorized', 'manual_release']
            else 'amber' if is_state(entity, 'on') else 'grey' }}
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_vehicule_actif
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: select.mennekes_amtron_vehicule_actif
          content: "{{ states(entity) }}"
          icon: mdi:car
          icon_color: green
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_limite_du_courant_de_charge
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: number.mennekes_amtron_limite_du_courant_de_charge
          content: "{{ states(entity) | int(0) }} A"
          icon: mdi:current-ac
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_charge_en_pause
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_charge_en_pause
          content: "{{ 'En pause' if is_state(entity, 'on') else 'Pause' }}"
          icon: mdi:pause
          icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
          tap_action:
            action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_autorisation_de_charge
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_autorisation_de_charge
          content: "{{ 'Autorisation' if is_state(entity, 'on') else 'Autorisation coupée' }}"
          icon: "{{ 'mdi:lock-open-variant' if is_state(entity, 'on') else 'mdi:lock' }}"
          icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
          tap_action:
            action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: number.mennekes_amtron_objectif_energetique
        content: >-
          {% set e = states(entity) | float(0) %}{{ '%g kWh' % e if e > 0 else 'Objectif kWh' }}
        icon: mdi:lightning-bolt
        icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
        tap_action:
          action: more-info
      - type: template
        entity: datetime.mennekes_amtron_heure_cible
        content: >-
          {{ as_local(as_datetime(states(entity))).strftime('%d.%m. %H:%M') if has_value(entity) else 'Heure cible' }}
        icon: mdi:clock-outline
        icon_color: "{{ 'blue' if has_value(entity) else 'grey' }}"
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: mennekes_amtron_rtu.clear_target_time
          target:
            entity_id: datetime.mennekes_amtron_heure_cible
          confirmation:
            text: "Effacer l’heure cible ? Les objectifs kWh et % restent."
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_objectif_de_charge_du_vehicule
            state_not: unavailable
        chip:
          type: template
          entity: number.mennekes_amtron_objectif_de_charge_du_vehicule
          content: >-
            {% set s = states(entity) | float(0) %}{{ '%d %%' % s if s > 0 else 'Objectif %' }}
          icon: mdi:battery-charging-80
          icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.mennekes_amtron_recharge_invite
            state: inactive
        chip:
          type: template
          content: "Démarrer invité"
          icon: mdi:account-arrow-right
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_demarrer_la_recharge_invite
            confirmation:
              text: "Démarrer la recharge invité ? L’objectif kWh et l’heure cible s’appliquent."
      - type: conditional
        conditions:
          - condition: state
            entity: button.mennekes_amtron_utiliser_le_prochain_evenement
            state_not: unavailable
        chip:
          type: template
          content: "Calendrier"
          icon: mdi:calendar-import
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_utiliser_le_prochain_evenement
            confirmation:
              text: "Utiliser ce départ ? Un plan de départ peut lever une pause manuelle."
      - type: conditional
        conditions:
          - condition: state
            entity: button.mennekes_amtron_utiliser_le_depart_du_vehicule
            state_not: unavailable
        chip:
          type: template
          content: "Minuterie véhicule"
          icon: mdi:car-clock
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_utiliser_le_depart_du_vehicule
            confirmation:
              text: "Utiliser ce départ ? Un plan de départ peut lever une pause manuelle."
