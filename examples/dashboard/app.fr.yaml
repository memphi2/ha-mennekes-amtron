# Une carte manuelle (Mushroom) : tuile d’état et deux rangées de puces. Adaptez les ID si nécessaire.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: sensor.mennekes_amtron_etat_de_la_recharge
    primary: "AMTRON · {{ states('sensor.mennekes_amtron_puissance_totale', with_unit=True) if has_value('sensor.mennekes_amtron_puissance_totale') else '—' }}"
    secondary: >-
      {%- set p = namespace(l=[]) -%}
      {%- set c = states('number.mennekes_amtron_objectif_de_cout') | float(0) -%}
      {%- set e = states('number.mennekes_amtron_objectif_energetique') | float(0) -%}
      {%- set g = ' (%d %%)' % (states('sensor.mennekes_amtron_progression_de_la_cible') | int) if has_value('sensor.mennekes_amtron_progression_de_la_cible') else '' -%}
      {%- if c > 0 %}{% set p.l = p.l + [states('number.mennekes_amtron_objectif_de_cout', with_unit=True) ~ g] %}{% elif e > 0 %}{% set p.l = p.l + ['%g kWh' % e ~ g] %}{% endif -%}
      {%- if has_value('datetime.mennekes_amtron_heure_cible') %}{% set p.l = p.l + ['jusqu’à ' ~ as_local(as_datetime(states('datetime.mennekes_amtron_heure_cible'))).strftime('%H:%M')] %}{% endif -%}
      {%- set s = states('number.mennekes_amtron_objectif_de_charge_du_vehicule') | float(0) -%}
      {%- if s > 0 %}{% set p.l = p.l + ['%d %%' % s] %}{% endif -%}
      {%- set t = state_attr('sensor.mennekes_amtron_motif_dattente_de_la_recharge', 'departure_plan') -%}
      {{ 'En attente de la première mesure' if is_state(entity, 'unknown') else 'Connexion interrompue' if is_state(entity, 'unavailable') else state_translated(entity) }} · {{ states('sensor.mennekes_amtron_energie_de_la_session', with_unit=True) if has_value('sensor.mennekes_amtron_energie_de_la_session') else '—' }}
      {%- if has_value('sensor.mennekes_amtron_cout_de_charge_estime_charge_actuelle') %} · {{ states('sensor.mennekes_amtron_cout_de_charge_estime_charge_actuelle', with_unit=True) }}{% endif %}

      {{ 'Objectifs : ' ~ p.l | join(' · ') if p.l else 'Aucun objectif' }}
      {%- if t not in [none, 'disabled'] %} · Planification: {{ state_attr_translated('sensor.mennekes_amtron_motif_dattente_de_la_recharge', 'departure_plan') }}{% endif %}
    multiline_secondary: true
    icon: mdi:ev-station
    color: >-
      {% set s = states(entity) %}{{ 'green' if s == 'charging' else 'amber' if s == 'paused'
      else 'red' if s in ['wallbox_error', 'unavailable']
      else 'amber' if s in ['state_uncertain', 'data_missing']
      else 'grey' if s in ['unknown', 'checking_status', 'initializing'] else 'blue' }}
    tap_action:
      action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_plug_charge_virtuel
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_plug_charge_virtuel
          content: >-
            {{ 'P&C prêt' if state_attr('sensor.mennekes_amtron_motif_dattente_de_la_recharge', 'plug_charge') in ['authorized', 'manual_release']
            else 'P&C en attente' if is_state(entity, 'on') else 'P&C coupé' }}
          icon: mdi:car-key
          icon_color: >-
            {{ 'green' if state_attr('sensor.mennekes_amtron_motif_dattente_de_la_recharge', 'plug_charge') in ['authorized', 'manual_release']
            else 'amber' if is_state(entity, 'on') else 'grey' }}
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_vehicule_actif
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: select.mennekes_amtron_vehicule_actif
          content: "{{ states(entity) }}"
          icon: mdi:car
          icon_color: green
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_limite_du_courant_de_charge
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: number.mennekes_amtron_limite_du_courant_de_charge
          content: "{{ states(entity) | int(0) }} A"
          icon: mdi:current-ac
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_phases_demandees
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: select.mennekes_amtron_phases_demandees
          content: "{{ '1 phase' if is_state(entity, 'single_phase') else 'Toutes les phases' }}"
          icon: mdi:sine-wave
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: button.mennekes_amtron_annuler_la_modification_en_attente
            state_not: unavailable
        chip:
          type: template
          content: "Annuler le changement"
          icon: mdi:close-circle-outline
          icon_color: amber
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_annuler_la_modification_en_attente
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_charge_en_pause
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_charge_en_pause
          content: "{{ 'En pause' if is_state(entity, 'on') else 'Pause' }}"
          icon: mdi:pause
          icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
          tap_action:
            action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mennekes_amtron_autorisation_de_charge
            state_not: [unknown, unavailable]
        chip:
          type: template
          entity: switch.mennekes_amtron_autorisation_de_charge
          content: "{{ 'Autorisation' if is_state(entity, 'on') else 'Autorisation coupée' }}"
          icon: "{{ 'mdi:lock-open-variant' if is_state(entity, 'on') else 'mdi:lock' }}"
          icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
          tap_action:
            action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: number.mennekes_amtron_objectif_energetique
        content: >-
          {% set e = states(entity) | float(0) %}{{ '%g kWh' % e if e > 0 else 'Objectif énergétique' }}
        icon: mdi:lightning-bolt
        icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
        tap_action:
          action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_objectif_de_cout
            state_not: unavailable
        chip:
          type: template
          entity: number.mennekes_amtron_objectif_de_cout
          content: >-
            {{ states(entity, with_unit=True) if states(entity) | float(0) > 0 else 'Objectif de coût' }}
          icon: mdi:cash
          icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
          tap_action:
            action: more-info
      - type: template
        entity: datetime.mennekes_amtron_heure_cible
        content: >-
          {{ as_local(as_datetime(states(entity))).strftime('%d.%m. %H:%M') if has_value(entity) else 'Heure cible' }}
        icon: mdi:clock-outline
        icon_color: "{{ 'blue' if has_value(entity) else 'grey' }}"
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: mennekes_amtron_rtu.clear_target_time
          target:
            entity_id: datetime.mennekes_amtron_heure_cible
          confirmation:
            text: "Effacer l’heure cible ? Les autres objectifs restent."
      - type: conditional
        conditions:
          - condition: state
            entity: number.mennekes_amtron_objectif_de_charge_du_vehicule
            state_not: unavailable
        chip:
          type: template
          entity: number.mennekes_amtron_objectif_de_charge_du_vehicule
          content: >-
            {% set s = states(entity) | float(0) %}{{ '%d %%' % s if s > 0 else 'Objectif véhicule' }}
          icon: mdi:battery-charging-80
          icon_color: "{{ 'blue' if states(entity) | float(0) > 0 else 'grey' }}"
          tap_action:
            action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.mennekes_amtron_recharge_invite
            state: "off"
        chip:
          type: template
          content: "Démarrer invité"
          icon: mdi:account-arrow-right
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mennekes_amtron_demarrer_la_recharge_invite
            confirmation:
              text: "Démarrer la recharge invité ? Les objectifs énergétique et de coût et l’heure cible la terminent."
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_vehicule_actif
            state_not: unavailable
        chip:
          type: template
          content: "Calendrier"
          icon: mdi:calendar-import
          tap_action:
            action: perform-action
            perform_action: mennekes_amtron_rtu.use_calendar_departure
            confirmation:
              text: "Utiliser ce départ ? Un plan de départ peut lever une pause manuelle."
      - type: conditional
        conditions:
          - condition: state
            entity: select.mennekes_amtron_vehicule_actif
            state_not: unavailable
        chip:
          type: template
          content: "Minuterie véhicule"
          icon: mdi:car-clock
          tap_action:
            action: perform-action
            perform_action: mennekes_amtron_rtu.use_vehicle_departure
            confirmation:
              text: "Utiliser ce départ ? Un plan de départ peut lever une pause manuelle."
