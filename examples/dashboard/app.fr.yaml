# Manual card. Check the translated entity IDs. No helpers or scripts.
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_etat_de_la_recharge
  primary: AMTRON · {{ states('sensor.mennekes_amtron_puissance_totale', with_unit=True) if has_value('sensor.mennekes_amtron_puissance_totale')
    else '—' }}
  secondary: '{{ state_translated(''sensor.mennekes_amtron_etat_de_la_recharge'') if has_value(''sensor.mennekes_amtron_etat_de_la_recharge'')
    else ''Indisponible'' }}

    Session: {{ states(''sensor.mennekes_amtron_energie_de_la_session'', with_unit=True) if has_value(''sensor.mennekes_amtron_energie_de_la_session'')
    else ''—'' }}'
  icon: '{{ ''mdi:ev-station'' if is_state(''sensor.mennekes_amtron_etat_de_la_recharge'',''charging'') else ''mdi:pause-circle''
    if is_state(''sensor.mennekes_amtron_etat_de_la_recharge'',''paused'') else ''mdi:alert-circle'' if states(''sensor.mennekes_amtron_etat_de_la_recharge'')
    in [''wallbox_error'',''unavailable'',''unknown''] else ''mdi:ev-plug-type2'' }}'
  color: '{{ ''green'' if is_state(''sensor.mennekes_amtron_etat_de_la_recharge'',''charging'') else ''amber'' if
    is_state(''sensor.mennekes_amtron_etat_de_la_recharge'',''paused'') else ''red'' if states(''sensor.mennekes_amtron_etat_de_la_recharge'')
    in [''wallbox_error'',''unavailable'',''unknown''] else ''blue'' }}'
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-number-card
  entity: number.mennekes_amtron_limite_du_courant_de_charge
  name: Limite courant
  display_mode: slider
- type: custom:mushroom-chips-card
  alignment: center
  chips:
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_charge_en_pause
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_charge_en_pause
      content: '{{ ''En pause'' if is_state(''switch.mennekes_amtron_charge_en_pause'',''on'') else ''Pause'' }}'
      icon: '{{ ''mdi:pause-circle'' if is_state(''switch.mennekes_amtron_charge_en_pause'',''on'') else ''mdi:play-circle-outline''
        }}'
      icon_color: '{{ ''amber'' if is_state(''switch.mennekes_amtron_charge_en_pause'',''on'') else ''grey'' }}'
      tap_action:
        action: toggle
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_autorisation_de_charge
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_autorisation_de_charge
      content: '{{ ''Autorisé'' if is_state(''switch.mennekes_amtron_autorisation_de_charge'',''on'') else ''Non
        autorisé'' }}'
      icon: '{{ ''mdi:power-plug'' if is_state(''switch.mennekes_amtron_autorisation_de_charge'',''on'') else ''mdi:power-plug-off''
        }}'
      icon_color: '{{ ''green'' if is_state(''switch.mennekes_amtron_autorisation_de_charge'',''on'') else ''grey''
        }}'
      tap_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_plug_charge_virtuel
      state_not:
      - unknown
      - unavailable
    chip:
      type: template
      entity: switch.mennekes_amtron_plug_charge_virtuel
      content: '{{ ''P&C désactivé'' if is_state(''switch.mennekes_amtron_plug_charge_virtuel'',''off'') else ''P&C
        prêt'' if states(''sensor.mennekes_amtron_etat_de_plug_charge_virtuel'') in [''authorized'',''manual_release'']
        else ''P&C attend'' }}'
      icon: '{{ ''mdi:car-key'' if states(''sensor.mennekes_amtron_etat_de_plug_charge_virtuel'') in [''authorized'',''manual_release'']
        else ''mdi:car-clock'' if is_state(''switch.mennekes_amtron_plug_charge_virtuel'',''on'') else ''mdi:car-off''
        }}'
      icon_color: '{{ ''grey'' if is_state(''switch.mennekes_amtron_plug_charge_virtuel'',''off'') else ''green''
        if states(''sensor.mennekes_amtron_etat_de_plug_charge_virtuel'') in [''authorized'',''manual_release'']
        else ''amber'' }}'
      tap_action:
        action: more-info
  - type: entity
    entity: select.mennekes_amtron_vehicule_actif
    name: Véhicule
    content_info: state
    icon: mdi:car-multiple
    tap_action:
      action: more-info
- type: custom:mushroom-title-card
  title: ''
  subtitle: 0 A retire la limite ; utilisez Pause pour suspendre.
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity: button.mennekes_amtron_demarrer_la_recharge_invite
      state_not:
      - unknown
      - unavailable
    - condition: state
      entity: sensor.mennekes_amtron_etat_de_la_charge_programmee
      state_not:
      - unknown
      - unavailable
  card:
    type: custom:mushroom-template-card
    entity: datetime.mennekes_amtron_heure_cible
    primary: Heure cible
    secondary: '{{ as_local(as_datetime(states(''datetime.mennekes_amtron_heure_cible''))).strftime(''%d/%m/%Y %H:%M'')
      if has_value(''datetime.mennekes_amtron_heure_cible'') else ''Non défini'' }}

      Touchez pour modifier · Maintenez pour effacer'
    icon: mdi:calendar-clock
    color: blue
    multiline_secondary: true
    tap_action:
      action: more-info
    hold_action:
      action: perform-action
      perform_action: mennekes_amtron_rtu.clear_target_time
      target:
        entity_id: datetime.mennekes_amtron_heure_cible
      confirmation:
        text: Effacer l’heure ? Les autres objectifs restent inchangés.
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_motif_dattente_de_la_recharge
  primary: État
  secondary: '{{ state_translated(''sensor.mennekes_amtron_motif_dattente_de_la_recharge'') if has_value(''sensor.mennekes_amtron_motif_dattente_de_la_recharge'')
    else ''Indisponible'' }}'
  icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_motif_dattente_de_la_recharge'') in
    [''reached'', ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_motif_dattente_de_la_recharge'')
    in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:timer-sand'' }}'
  color: '{{ ''red'' if states(''sensor.mennekes_amtron_motif_dattente_de_la_recharge'') in [''error'', ''interrupted'',
    ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_motif_dattente_de_la_recharge'')
    in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey'' if
    states(''sensor.mennekes_amtron_motif_dattente_de_la_recharge'') in [''disabled'', ''none''] else ''amber''
    }}'
  multiline_secondary: true
  tap_action:
    action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_objectif_energetique
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Objectif de charge
      subtitle: kWh supplémentaires ou pourcentage du véhicule. Limite uniquement, sans démarrage. 0 désactive la
        limite.
    - type: entities
      show_header_toggle: false
      entities:
      - entity: number.mennekes_amtron_objectif_energetique
        name: Énergie supplémentaire
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_etat_de_lobjectif_energetique
      primary: Énergie supplémentaire
      secondary: '{{ state_translated(''sensor.mennekes_amtron_etat_de_lobjectif_energetique'') if has_value(''sensor.mennekes_amtron_etat_de_lobjectif_energetique'')
        else ''Indisponible'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_energetique'')
        in [''reached'', ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_energetique'')
        in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:lightning-bolt''
        }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_energetique'') in [''error'', ''interrupted'',
        ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_energetique'')
        in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey''
        if states(''sensor.mennekes_amtron_etat_de_lobjectif_energetique'') in [''disabled'', ''none''] else ''amber''
        }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_objectif_de_charge_du_vehicule
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-number-card
      entity: number.mennekes_amtron_objectif_de_charge_du_vehicule
      name: Niveau cible
      display_mode: slider
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule
      primary: Niveau cible
      secondary: '{{ state_translated(''sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule'') if has_value(''sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule'')
        else ''Indisponible'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule'')
        in [''reached'', ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule'')
        in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:battery-arrow-up-outline''
        }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule'') in [''error'',
        ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule'')
        in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey''
        if states(''sensor.mennekes_amtron_etat_de_lobjectif_de_charge_du_vehicule'') in [''disabled'', ''none'']
        else ''amber'' }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: number.mennekes_amtron_objectif_de_charge_du_vehicule
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Objectif véhicule facultatif
    secondary: 'Configurer → Véhicules : choisir une source de niveau de batterie.'
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_etat_de_la_charge_programmee
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Planifier le départ
      subtitle: Un seul départ. Nécessite niveau de batterie et capacité utile. Peut lever une pause manuelle.
    - type: custom:mushroom-chips-card
      chips:
      - type: entity
        entity: button.mennekes_amtron_utiliser_le_prochain_evenement
        name: Calendrier
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_utiliser_le_prochain_evenement
          confirmation:
            text: Appliquer ? Un plan de départ peut lever une pause manuelle.
      - type: entity
        entity: button.mennekes_amtron_utiliser_le_depart_du_vehicule
        name: Minuteur véhicule
        content_info: name
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_utiliser_le_depart_du_vehicule
          confirmation:
            text: Appliquer ? Un plan de départ peut lever une pause manuelle.
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_etat_de_la_charge_programmee
      primary: État
      secondary: '{{ state_translated(''sensor.mennekes_amtron_etat_de_la_charge_programmee'') if has_value(''sensor.mennekes_amtron_etat_de_la_charge_programmee'')
        else ''Indisponible'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_etat_de_la_charge_programmee'')
        in [''reached'', ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_etat_de_la_charge_programmee'')
        in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:car-clock'' }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_etat_de_la_charge_programmee'') in [''error'', ''interrupted'',
        ''job_storage_unavailable'', ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_etat_de_la_charge_programmee'')
        in [''active'', ''charging'', ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey''
        if states(''sensor.mennekes_amtron_etat_de_la_charge_programmee'') in [''disabled'', ''none''] else ''amber''
        }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_etat_de_la_charge_programmee
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Planification facultative
    secondary: 'Configurer → Véhicules → Prochain départ : activer et indiquer la capacité utile.'
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: button.mennekes_amtron_demarrer_la_recharge_invite
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Recharge invité
      subtitle: Démarre immédiatement et lève la pause et la restriction P&C pour cette connexion. Les limites en
        kWh et de temps s’appliquent.
    - type: custom:mushroom-entity-card
      entity: button.mennekes_amtron_demarrer_la_recharge_invite
      name: Démarrer invité
      secondary_info: none
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.mennekes_amtron_demarrer_la_recharge_invite
    - type: custom:mushroom-template-card
      entity: sensor.mennekes_amtron_recharge_invite
      primary: État
      secondary: '{{ state_translated(''sensor.mennekes_amtron_recharge_invite'') if has_value(''sensor.mennekes_amtron_recharge_invite'')
        else ''Indisponible'' }}'
      icon: '{{ ''mdi:check-circle-outline'' if states(''sensor.mennekes_amtron_recharge_invite'') in [''reached'',
        ''estimated_reached'', ''finished''] else ''mdi:alert-circle-outline'' if states(''sensor.mennekes_amtron_recharge_invite'')
        in [''error'', ''interrupted'', ''job_storage_unavailable'', ''unavailable''] else ''mdi:account-clock-outline''
        }}'
      color: '{{ ''red'' if states(''sensor.mennekes_amtron_recharge_invite'') in [''error'', ''interrupted'', ''job_storage_unavailable'',
        ''unavailable''] else ''green'' if states(''sensor.mennekes_amtron_recharge_invite'') in [''active'', ''charging'',
        ''finishing'', ''ready'', ''reached'', ''estimated_reached''] else ''grey'' if states(''sensor.mennekes_amtron_recharge_invite'')
        in [''disabled'', ''none''] else ''amber'' }}'
      multiline_secondary: true
      tap_action:
        action: more-info
- type: conditional
  conditions:
  - condition: state
    entity: button.mennekes_amtron_demarrer_la_recharge_invite
    state:
    - unknown
    - unavailable
  card:
    type: custom:mushroom-template-card
    primary: Recharge invité indisponible
    secondary: Connectez l’application et autorisez l’écriture. Vérifiez les identifiants.
    multiline_secondary: true
    icon: mdi:information-outline
    color: blue
    tap_action:
      action: none
