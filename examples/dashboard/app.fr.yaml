# Paste into a Manual card. Check entity IDs first. No helpers or scripts required.
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.mennekes_amtron_etat_de_la_recharge
  icon: mdi:ev-station
  primary: >-
    AMTRON · {{ states('sensor.mennekes_amtron_puissance_totale', with_unit=True) if has_value('sensor.mennekes_amtron_puissance_totale')
    else '—' }}
  secondary: |-
    {{ state_translated('sensor.mennekes_amtron_etat_de_la_recharge') if has_value('sensor.mennekes_amtron_etat_de_la_recharge') else 'État indisponible' }}
    Session: {{ states('sensor.mennekes_amtron_energie_de_la_session', with_unit=True) if has_value('sensor.mennekes_amtron_energie_de_la_session') else '—' }}
  multiline_secondary: true
  color: >-
    {{ 'green' if is_state('sensor.mennekes_amtron_etat_de_la_recharge', 'charging') else 'red' if is_state('sensor.mennekes_amtron_etat_de_la_recharge',
    'wallbox_error') or not has_value('sensor.mennekes_amtron_etat_de_la_recharge') else 'amber' if is_state('sensor.mennekes_amtron_etat_de_la_recharge',
    'paused') else 'blue' }}
  tap_action:
    action: more-info
- type: custom:mushroom-number-card
  entity: number.mennekes_amtron_limite_du_courant_de_charge
  name: Courant maximal
  icon: mdi:current-ac
  display_mode: slider
  layout: horizontal
- type: custom:mushroom-chips-card
  alignment: center
  chips:
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_charge_en_pause
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: switch.mennekes_amtron_charge_en_pause
      name: Pause
      content_info: name
      icon: mdi:pause-circle
      tap_action:
        action: toggle
      hold_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_autorisation_de_charge
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: switch.mennekes_amtron_autorisation_de_charge
      name: Autorisation
      content_info: name
      icon: mdi:ev-plug-type2
      tap_action:
        action: more-info
      hold_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: switch.mennekes_amtron_plug_charge_virtuel
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: switch.mennekes_amtron_plug_charge_virtuel
      name: Plug & Charge
      content_info: name
      icon: mdi:car-key
      tap_action:
        action: more-info
      hold_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: select.mennekes_amtron_vehicule_actif
      state_not:
      - unknown
      - unavailable
    chip:
      type: entity
      entity: select.mennekes_amtron_vehicule_actif
      name: Véhicule
      content_info: name
      icon: mdi:car-multiple
      tap_action:
        action: more-info
- type: custom:mushroom-title-card
  subtitle: 0 A supprime la limite · Pause suspend la charge
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_motif_dattente_de_la_recharge
    state_not:
    - unknown
    - unavailable
  - condition: state
    entity: sensor.mennekes_amtron_motif_dattente_de_la_recharge
    state_not:
    - none
    - no_vehicle
  card:
    type: custom:mushroom-entity-card
    entity: sensor.mennekes_amtron_motif_dattente_de_la_recharge
    name: Commande de charge
    tap_action:
      action: more-info
    layout: horizontal
- type: conditional
  conditions:
  - condition: state
    entity: sensor.mennekes_amtron_brouillon_de_recharge
    state_not:
    - unknown
    - unavailable
  card:
    type: vertical-stack
    cards:
    - type: custom:mushroom-entity-card
      entity: sensor.mennekes_amtron_ordre_de_recharge
      name: Session planifiée
      tap_action:
        action: more-info
      layout: horizontal
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-number-card
        entity: number.mennekes_amtron_courant_de_la_recharge
        name: Courant
        display_mode: buttons
      - type: custom:mushroom-number-card
        entity: number.mennekes_amtron_energie_de_la_recharge
        name: Énergie
        display_mode: buttons
    - type: entities
      show_header_toggle: false
      entities:
      - entity: datetime.mennekes_amtron_fin_au_plus_tard
        name: Fin avant
    - type: custom:mushroom-entity-card
      entity: sensor.mennekes_amtron_brouillon_de_recharge
      name: Brouillon
      tap_action:
        action: more-info
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_demarrer_la_recharge
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_demarrer_la_recharge
          confirmation:
            text: Démarrer le brouillon enregistré ?
        name: Démarrer
        secondary_info: none
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_arreter_la_recharge
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_arreter_la_recharge
          confirmation:
            text: Arrêter l’ordre et mettre en pause ?
        name: Arrêter
        secondary_info: none
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_effacer_la_recharge
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_effacer_la_recharge
          confirmation:
            text: Effacer l’ordre terminé sans démarrer la recharge ?
        name: Effacer
        secondary_info: none
      - type: custom:mushroom-entity-card
        entity: button.mennekes_amtron_reinitialiser_le_brouillon
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mennekes_amtron_reinitialiser_le_brouillon
          confirmation:
            text: Réinitialiser le brouillon ? L’ordre actuel reste inchangé.
        name: Réinitialiser
        secondary_info: none
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity: sensor.mennekes_amtron_brouillon_de_recharge
      state:
      - unknown
      - unavailable
  card:
    type: custom:mushroom-template-card
    icon: mdi:information-outline
    color: amber
    primary: Planification indisponible
    secondary: Mettre à jour application et intégration vers 0.9.0b6 minimum. Vérifier connexion et identifiants des entités.
    multiline_secondary: true
    tap_action:
      action: none
