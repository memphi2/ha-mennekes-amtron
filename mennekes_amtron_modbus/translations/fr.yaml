configuration:
  serial_port:
    name: Adaptateur série (chemin)
    description: "Choisissez l’adaptateur USB dans la liste de l’interface Web. Son chemin est enregistré ici. Ignoré pour le réseau et supprimé lors de l’enregistrement réseau dans l’interface Web."
  device_id:
    name: Adresse de la borne
    description: Adresse Modbus configurée sur la borne.
  baudrate:
    name: Vitesse de transmission
    description: "Pour USB / RS-485 uniquement : doit correspondre à la borne. En mode réseau, réglez le débit sur l’adaptateur."
  frame:
    name: Format de trame série
    description: "Pour USB / RS-485 uniquement : bits de données, parité et bits d’arrêt de la borne. En mode réseau, réglez-les sur l’adaptateur."
  read_only:
    name: Lecture seule
    description: Désactive les commandes de charge, y compris celles de Home Assistant, et le signal de présence du service ; les lectures Modbus restent actives.
  current_cap:
    name: Plafond du courant
    description: Courant de charge maximal demandé par le gestionnaire d’énergie, en ampères. Une commande explicite à 0 A supprime la limite du gestionnaire d’énergie.
  state_change_interval_seconds:
    name: Délai minimal entre changements d’état
    description: "Délai minimal en secondes entre les démarrages, les pauses et les changements d’autorisation de charge, de verrouillage ou de phases (300 par défaut). Les commandes trop précoces sont mises en attente ; la dernière remplace la précédente. L’intervalle de cinq secondes entre écritures du courant reste applicable. La valeur 0 désactive le délai prolongé."
  phase_switch_grace_seconds:
    name: "Attente supplémentaire avant changement de phases"
    description: "Secondes d’attente supplémentaires entre la confirmation de la pause de charge par le véhicule et le changement de phases (5 par défaut, de 0 à 30). La valeur 0 supprime uniquement cette attente supplémentaire ; la confirmation de la pause reste obligatoire."
  scan_interval:
    name: Intervalle de lecture de l’état
    description: Secondes entre les lectures de l’état. Le signal de présence fonctionne indépendamment.
  measurement_interval:
    name: Intervalle des mesures
    description: Secondes entre les lectures des mesures ; un intervalle de 30 secondes limite le volume de données dans Recorder.
  listen:
    name: Adresse d’écoute de l’API
    description: Conservez 0.0.0.0 pour l’accès via le réseau privé de l’application.
  port:
    name: Port interne de l’API
    description: Fixé à 8765 ; la publication du port sur l’hôte est facultative et généralement inutile.
  connection_type:
    name: Connexion à la borne
    description: "Ouvrez l’interface Web pour choisir un adaptateur USB ou saisir l’hôte et le port réseau. Enregistrez puis redémarrez l’application."
  host:
    name: Hôte / adresse IP de l’adaptateur
    description: "Obligatoire en mode réseau : nom d’hôte ou adresse IP de l’adaptateur, sans schéma ni chemin d’URL. Laissez vide pour USB / RS-485. Utilisez un réseau privé de confiance."
  tcp_port:
    name: Port TCP de l’adaptateur
    description: Port TCP configuré sur l’adaptateur ; 502 par défaut. Il ne s’agit pas du port HTTP 8765 du service indépendant.
  tcp_authentication:
    name: "Authentification TCP"
    description: "L’authentification ne chiffre pas les données. Elle peut être contournée avec le firmware 1.523 ; utilisez un réseau local protégé."
  tcp_auth_password:
    name: "Mot de passe web actuel de l’adaptateur"
    description: "Mot de passe web actuel pour l’authentification TCP : 1 à 9 caractères ASCII imprimables sans espaces. Le mot de passe de l’adaptateur n’est pas modifié."
network:
  8765/tcp: API du service avec authentification ; l’accès interne ne nécessite aucun port publié sur l’hôte.
