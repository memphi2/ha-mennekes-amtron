configuration:
  serial_port:
    name: Adattatore seriale
    description: Adattatore RS-485 a uso esclusivo, preferibilmente con percorso stabile /dev/serial/by-id.
  device_id:
    name: Indirizzo della wallbox
    description: Indirizzo Modbus configurato nella wallbox.
  baudrate:
    name: Velocità in baud
    description: Deve corrispondere alla configurazione seriale della wallbox.
  frame:
    name: Formato seriale
    description: Bit di dati, parità e bit di stop configurati nella wallbox.
  read_only:
    name: Sola lettura
    description: Disabilita i comandi di ricarica, compresi i controlli di Home Assistant, e l'heartbeat del servizio; le letture Modbus rimangono attive.
  current_cap:
    name: Corrente massima
    description: Corrente EMS massima richiesta in ampere. I comandi espliciti con 0 A rimuovono il limite EMS.
  scan_interval:
    name: Intervallo di stato
    description: Secondi tra le letture dello stato. L'heartbeat funziona indipendentemente.
  measurement_interval:
    name: Intervallo delle misurazioni
    description: Secondi tra le letture delle misurazioni; 30 secondi limitano il carico su Recorder.
  listen:
    name: Indirizzo di ascolto API
    description: Mantieni 0.0.0.0 per l'accesso tramite la rete privata dell'app.
  port:
    name: Porta API interna
    description: Fissa a 8765; esporre la porta sull'host è facoltativo e normalmente non necessario.
network:
  8765/tcp: API del servizio con autenticazione; l'accesso interno non richiede una porta esposta sull'host.
