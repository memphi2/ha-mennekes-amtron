name: Mennekes Amtron Modbus Service
version: 0.5.0
url: https://github.com/memphi2/ha-mennekes-amtron
slug: mennekes_amtron_modbus
description: Independent Modbus connection and heartbeat for Mennekes Amtron
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
uart: true
udev: true
apparmor: true
discovery:
  - mennekes_amtron_rtu
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Authenticated service API (internal network by default)
watchdog: http://[HOST]:[PORT:8765]/health
options:
  connection_type: serial
  tcp_port: 502
  device_id: 50
  baudrate: "57600"
  frame: 8n2
  read_only: true
  current_cap: 6
  scan_interval: 5
  measurement_interval: 30
  listen: 0.0.0.0
  port: 8765
schema:
  connection_type: list(serial|rtu_over_tcp|modbus_tcp)
  serial_port: device(subsystem=tty)?
  host: str?
  tcp_port: port
  device_id: int(10,50)
  baudrate: list(9600|14400|19200|28800|38400|56000|57600)
  frame: list(8n2|8e1|8o1)
  read_only: bool
  current_cap: float(6,32)
  scan_interval: int(2,300)
  measurement_interval: int(2,300)
  listen: str
  port: int(8765,8765)
