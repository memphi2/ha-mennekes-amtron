blueprint:
  name: MENNEKES AMTRON - recover from a lost heartbeat
  description: >-
    Legacy automation: the integration now recovers error 200 automatically
    in master mode. Disable this automation to avoid duplicate attempts.
    Recovery preserves a pause, device lock and disabled charging release.

    Presses the recovery button when the wallbox reports that the energy
    manager is unavailable.

    The wallbox enters that state when it does not receive a heartbeat in time,
    and it will not start a charging session until the heartbeat, the charging
    release and the charging current have been written again. The recovery
    button writes exactly that sequence.

    If the fault returns, investigate restarts, delayed heartbeat writes and
    bus failures: see docs/troubleshooting.md.
  domain: automation
  homeassistant:
    min_version: "2026.9.0"
  input:
    error_code:
      name: Error
      description: The wallbox Error binary sensor; its category attribute names the error.
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: binary_sensor
              device_class: problem
    recover_button:
      name: Recover from error
      description: The wallbox recovery button.
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: button
    settle_time:
      name: Settle time
      description: How long the error has to persist before recovering.
      default:
        minutes: 1
      selector:
        duration:

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input error_code
    attribute: category
    to: energy_manager_unavailable
    for: !input settle_time

conditions: []

actions:
  - action: button.press
    target:
      entity_id: !input recover_button
