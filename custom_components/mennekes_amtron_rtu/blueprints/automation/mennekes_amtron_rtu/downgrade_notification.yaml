blueprint:
  name: MENNEKES AMTRON - notify on a grid-operator downgrade
  description: >-
    Sends a notification when the grid operator limits the wallbox, and
    another when the limit is released.

    The downgrade is enforced inside the wallbox over its own hardware input.
    Nothing on the Modbus side can prevent or raise it; this automation only
    makes it visible, which is the point.
  domain: automation
  homeassistant:
    min_version: "2026.9.0"
  input:
    charging_status:
      name: Charging status
      description: The wallbox Charging status sensor; its "downgraded_to" attribute holds the limit while one applies.
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: sensor
    notify_action:
      name: Notification action
      description: The notify action to call, for example notify.persistent_notification.
      default: notify.persistent_notification
      selector:
        text:

mode: queued
max: 5

variables:
  notify_service: !input notify_action

triggers:
  - trigger: state
    entity_id: !input charging_status
    attribute: downgraded_to

conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ['unavailable', 'unknown']
         and trigger.to_state.state not in ['unavailable', 'unknown'] }}

actions:
  - variables:
      limit: "{{ trigger.to_state.attributes.get('downgraded_to') }}"
  - choose:
      - conditions: "{{ limit is not none }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: Wallbox downgraded
              message: The grid operator limited the wallbox to {{ limit }} A.
      - conditions: "{{ trigger.from_state.attributes.get('downgraded_to') is not none }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: Wallbox downgrade released
              message: The grid operator released the wallbox limit.
