blueprint:
  name: MENNEKES AMTRON - charge from PV surplus
  description: >-
    Follows the photovoltaic surplus with the wallbox charging current.

    The current is recomputed when surplus or selected phases change, a
    vehicle connects, or charging resumes. It is divided by one or three
    phases and clamped to the configured current range.
    This assumes a three-phase installation when all phases are selected.
    It only writes while a vehicle is connected and charging is not paused.
    Select the Charging paused input when updating an existing automation;
    without it, the automation leaves the current unchanged.

    The manufacturer asks for at most one current change every five seconds.
    The integration enforces that by deferring a faster change and writing the
    newest value, so this automation does not need a rate limit of its own.

    Pausing when the surplus disappears needs hysteresis and is a separate
    concern; use the "pause and resume on PV surplus" blueprint for it.
  domain: automation
  homeassistant:
    min_version: "2026.9.0"
  input:
    surplus_power:
      name: PV surplus
      description: >-
        Total power available to the wallbox in W or kW, positive for surplus,
        including power already used by the vehicle. Raw grid export alone
        is not this budget while charging.
        Unknown values or other units leave the current unchanged.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    charging_current:
      name: Charging current limit
      description: The wallbox charging-current limit.
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: number
    charging_paused:
      name: Charging paused
      description: >-
        Select this wallbox's charging-pause switch. Required for current
        updates; an empty selection leaves existing automations inactive.
      default: ""
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: switch
    vehicle_connected:
      name: Vehicle connected
      description: The wallbox vehicle-connected binary sensor.
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: binary_sensor
    switched_phases:
      name: Requested phases
      description: >-
        Choose Requested phases; its switched attribute says which phases the
        wallbox really uses. This blueprint assumes a three-phase supply: single
        phase uses one phase and all available uses three. It does not detect
        the vehicle's actual phase use. An unknown state leaves the current
        unchanged.
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: select
    grid_voltage:
      name: Grid voltage
      description: The voltage used to convert watts into amps.
      default: 230
      selector:
        number:
          min: 100
          max: 250
          step: 1
          unit_of_measurement: V
          mode: box
    minimum_current:
      name: Minimum current
      description: >-
        Never ask for less than this. The wallbox refuses anything below 6 A:
        on this device, values from 0.01 A to 5.99 A mean "signal 0 A to the
        vehicle".
      default: 6
      selector:
        number:
          min: 6
          max: 32
          step: 0.1
          unit_of_measurement: A
          mode: box
    maximum_current:
      name: Maximum current
      description: Upper bound, also limited by the charging-current entity maximum.
      default: 16
      selector:
        number:
          min: 6
          max: 32
          step: 0.1
          unit_of_measurement: A
          mode: box

# A slow command must not hide a newer power budget. The integration keeps
# the write cooldown even if the superseded operation is cancelled.
mode: restart
max_exceeded: silent

trigger_variables:
  paused_entity: !input charging_paused

variables:
  surplus_entity: !input surplus_power
  phases_entity: !input switched_phases
  current_entity: !input charging_current
  volts: !input grid_voltage
  minimum: !input minimum_current
  maximum: !input maximum_current

triggers:
  - trigger: state
    entity_id: !input surplus_power
  - trigger: state
    entity_id: !input switched_phases
    attribute: switched
  - trigger: state
    entity_id: !input vehicle_connected
    to: "on"
  # A template keeps the empty default valid for existing automations.
  - trigger: template
    value_template: >-
      {{ paused_entity != '' and is_state(paused_entity, 'off') }}

conditions:
  - condition: state
    entity_id: !input vehicle_connected
    state: "on"
  - condition: template
    value_template: >-
      {{ paused_entity != '' and is_state(paused_entity, 'off')
         and is_number(states(surplus_entity))
         and state_attr(surplus_entity, 'unit_of_measurement') in ['W', 'kW']
         and state_attr(phases_entity, 'switched') in ['single_phase', 'all_available']
         and not is_state(current_entity, 'unavailable')
         and is_number(state_attr(current_entity, 'max'))
         and minimum | float >= 6
         and minimum | float <= maximum | float
         and minimum | float <= state_attr(current_entity, 'max') | float(0) }}

actions:
  - action: number.set_value
    target:
      entity_id: !input charging_current
    data:
      value: >-
        {% set phases = 1 if state_attr(phases_entity, 'switched') == 'single_phase' else 3 %}
        {% set factor = 1000 if state_attr(surplus_entity, 'unit_of_measurement') == 'kW' else 1 %}
        {% set amps = states(surplus_entity) | float * factor / (volts | float) / phases %}
        {{ [[amps | round(1), minimum | float] | max,
             maximum | float, state_attr(current_entity, 'max') | float] | min }}
