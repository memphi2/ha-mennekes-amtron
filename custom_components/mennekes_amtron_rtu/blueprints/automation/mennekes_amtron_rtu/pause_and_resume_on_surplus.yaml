blueprint:
  name: MENNEKES AMTRON - pause and resume on PV surplus
  description: >-
    Pauses charging when the surplus stays low and resumes when it stays high.

    Two thresholds and two delays, because the manufacturer asks for hysteresis
    and for more than five minutes between a pause and a resume. Set the resume
    threshold clearly above the pause threshold; the defaults correspond to
    6 A on one phase and a comfortable margin above it.

    Pausing uses the charging-pause switch, which signals 0 A to the vehicle.
    It deliberately does not use the charging release, because that switches
    the wallbox relay and wears it out.
  domain: automation
  homeassistant:
    min_version: "2026.9.0"
  input:
    surplus_power:
      name: PV surplus
      description: >-
        Total power available to the wallbox in W or kW, positive for surplus,
        including power already used by the vehicle. Raw grid export alone
        is not this budget while charging.
        Unknown values or other units cancel pending threshold timers.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    charging_paused:
      name: Charging paused
      description: The wallbox charging-pause switch.
      selector:
        entity:
          filter:
            - integration: mennekes_amtron_rtu
              domain: switch
    pause_below:
      name: Pause below
      description: Pause when the surplus stays below this.
      default: 1380
      selector:
        number:
          min: 0
          max: 20000
          step: 10
          unit_of_measurement: W
          mode: box
    resume_above:
      name: Resume above
      description: Resume when the surplus stays above this. Keep it above the pause threshold.
      default: 1700
      selector:
        number:
          min: 0
          max: 20000
          step: 10
          unit_of_measurement: W
          mode: box
    hold_time:
      name: Hold time
      description: >-
        How long the surplus has to stay past a threshold before anything
        happens. The manufacturer recommends more than five minutes between a
        pause and a resume.
      default:
        minutes: 6
      selector:
        duration:

mode: single
max_exceeded: silent

trigger_variables:
  surplus_entity: !input surplus_power
  pause_threshold: !input pause_below
  resume_threshold: !input resume_above

triggers:
  - trigger: template
    value_template: >-
      {% set unit = state_attr(surplus_entity, 'unit_of_measurement') %}
      {{ is_number(states(surplus_entity)) and unit in ['W', 'kW']
         and states(surplus_entity) | float(0) * (1000 if unit == 'kW' else 1)
             < pause_threshold | float }}
    for: !input hold_time
    id: pause
  - trigger: template
    value_template: >-
      {% set unit = state_attr(surplus_entity, 'unit_of_measurement') %}
      {{ is_number(states(surplus_entity)) and unit in ['W', 'kW']
         and states(surplus_entity) | float(0) * (1000 if unit == 'kW' else 1)
             > resume_threshold | float }}
    for: !input hold_time
    id: resume

conditions:
  - condition: template
    value_template: >-
      {{ resume_threshold | float > pause_threshold | float >= 0 }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: pause
          - condition: state
            entity_id: !input charging_paused
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input charging_paused
      - conditions:
          - condition: trigger
            id: resume
          - condition: state
            entity_id: !input charging_paused
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input charging_paused
