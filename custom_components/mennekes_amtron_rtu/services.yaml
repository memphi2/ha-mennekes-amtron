get_recorder_exclusions:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: mennekes_amtron_rtu
          multiple: true
    profile:
      default: detail
      selector:
        select:
          options:
            - full
            - detail
            - lean
          translation_key: recorder_profile
set_charging_current:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: mennekes_amtron_rtu
          multiple: true
    current:
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 32
          step: 0.1
          unit_of_measurement: A
          mode: box
    allow_unlimited:
      required: false
      default: false
      selector:
        boolean:
