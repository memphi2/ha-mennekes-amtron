get_recorder_exclusions:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: mennekes_amtron_rtu
          multiple: true
    profile:
      default: detail
      selector:
        select:
          options:
            - full
            - detail
            - lean
          translation_key: recorder_profile
set_charging_current:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: mennekes_amtron_rtu
          multiple: true
    current:
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 32
          step: 0.1
          unit_of_measurement: A
          mode: box
    allow_unlimited:
      required: false
      default: false
      selector:
        boolean:
start_guest_charging:
  fields:
    device_id: &wallbox
      required: false
      selector:
        device:
          integration: mennekes_amtron_rtu
          multiple: true
    duration:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    current:
      required: true
      example: 10
      selector:
        number:
          min: 6
          max: 32
          step: 0.1
          unit_of_measurement: A
          mode: box
    energy:
      required: true
      example: 10
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
          mode: box
stop_guest_charging:
  fields:
    device_id: *wallbox
clear_guest_charging:
  fields:
    device_id: *wallbox
