name: Security review gate

on:
  # These events run trusted default-branch code, also for PRs from forks.
  # A fresh head has no successful status and is blocked until reviewed.
  workflow_run:
    workflows: [Validate]
    types: [requested, completed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to recheck
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: security-review-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pull_request || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
        (github.event.comment.user.id == 199175422 ||
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.comment.author_association)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify the authenticated Codex security-review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pull_request }}
          REVIEW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python scripts/check_security_review.py --repository "$GH_REPO" --pr "$PR_NUMBER" --publish
          else
            python scripts/check_security_review.py --repository "$GH_REPO" --head-sha "$REVIEW_HEAD_SHA" --publish
          fi
