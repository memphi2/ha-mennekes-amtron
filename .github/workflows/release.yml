name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1"
        required: false
        type: string

# Serialize publication for a tag, including manual reruns. Never cancel a publisher.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  # Tag refs can move. Never reuse or populate dependency caches across runs
  # that may later execute with publication and attestation permissions.
  PIP_NO_CACHE_DIR: "1"
  RELEASE_ZIP: .release/ha-mennekes-amtron.zip
  RELEASE_SHA256SUMS: .release/SHA256SUMS
  RELEASE_METADATA: .release/build-metadata.json
  RELEASE_SBOM: .release/sbom.spdx.json

jobs:
  main-validation:
    name: main validation gate
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Require the tag to be the validated main commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $tag_sha, but origin/main is $main_sha"
            exit 1
          fi

          echo "commit=$tag_sha" >> "$GITHUB_OUTPUT"

          # GitHub's run and job records are the evidence. A green workflow
          # alone can include skipped jobs, so check the required names too.
          for workflow in validate.yml codeql.yml; do
            if [[ "$workflow" == validate.yml ]]; then
              required='["validate (min-ha)", "validate (latest-ha)", "hacs", "hassfest", "dependabot", "runtime resource soak", "standalone Modbus service (amd64)", "standalone Modbus service (aarch64)"]'
            else
              required='["analyze (actions)", "analyze (python)"]'
            fi
            for attempt in $(seq 1 90); do
              run="$(gh api --method GET "/repos/$REPOSITORY/actions/workflows/$workflow/runs" \
                -f branch=main -f event=push -f head_sha="$tag_sha" -f per_page=1 --jq '.workflow_runs[0]')"
              if [[ "$(jq -r '.status' <<<"$run")" == completed ]]; then
                jq -e --arg sha "$tag_sha" --arg repo "$REPOSITORY" '
                  .conclusion == "success" and .head_sha == $sha and .head_branch == "main"
                  and .event == "push" and .head_repository.full_name == $repo' <<<"$run" >/dev/null
                run_id="$(jq -r '.id' <<<"$run")"
                gh api --paginate "/repos/$REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" |
                  jq -se --argjson required "$required" --arg sha "$tag_sha" '
                    [.[].jobs[] | select(.head_sha == $sha)] as $jobs |
                    all($required[]; . as $name |
                      ([$jobs[] | select(.name == $name)] | max_by(.run_attempt, .id)) |
                      .status == "completed" and .conclusion == "success")' >/dev/null
                echo "$workflow verified for $tag_sha (run $run_id)"
                break
              fi
              if [[ "$attempt" == 90 ]]; then
                echo "::error::Timed out waiting for $workflow on $tag_sha"
                exit 1
              fi
              sleep 10
            done
          done

  service-plan:
    name: plan independent app release
    needs: [main-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
      packages: read
    outputs:
      build_required: ${{ steps.plan.outputs.build_required }}
      catalog_required: ${{ steps.plan.outputs.catalog_required }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/heads/main
          persist-credentials: false
      - name: Require the checked-out main to match the validated commit
        env:
          VALIDATED_COMMIT: ${{ needs.main-validation.outputs.commit }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse --verify HEAD)"
          if [ "$checked_out_commit" != "$VALIDATED_COMMIT" ]; then
            echo "::error::Main changed since validation; rerun the release for the validated main commit"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Compare app inputs and verify any reusable publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python scripts/plan_service_release.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

  service-images:
    name: service image (${{ matrix.architecture }})
    needs: [main-validation, service-plan]
    if: needs.service-plan.outputs.build_required == 'true' && needs.service-plan.outputs.catalog_required == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.main-validation.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install AppArmor validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor
      - name: Build, smoke-test and push the native image candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python scripts/service_image.py build --tag "$RELEASE_TAG" --architecture "$ARCHITECTURE" --path ".release/image-$ARCHITECTURE.json"
      - name: Show test-profile denials after a failed validation
        if: failure()
        run: |
          sudo journalctl --dmesg --no-pager --since '10 minutes ago' |
            grep -F 'profile="amtron-ci-' | tail -n 60 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-image-${{ matrix.architecture }}
          path: .release/image-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  service-manifest:
    name: publish service image
    needs: [service-images, main-validation, service-plan]
    if: >-
      ${{ always() && needs.main-validation.result == 'success' &&
          needs.service-plan.result == 'success' &&
          needs.service-plan.outputs.catalog_required == 'true' &&
          ((needs.service-plan.outputs.build_required == 'true' && needs.service-images.result == 'success') ||
           (needs.service-plan.outputs.build_required == 'false' && needs.service-images.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      channel: ${{ steps.image.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.main-validation.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.service-plan.outputs.build_required == 'true'
        with:
          pattern: service-image-*
          merge-multiple: true
          path: .release/images
      - name: Publish or verify the immutable multi-architecture version
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUILD_REQUIRED: ${{ needs.service-plan.outputs.build_required }}
          EXISTING_DIGEST: ${{ needs.service-plan.outputs.digest }}
        run: |
          if [ "$BUILD_REQUIRED" = true ]; then
            python scripts/service_image.py publish --tag "$RELEASE_TAG" --path .release/images
          else
            python scripts/service_image.py existing --tag "$RELEASE_TAG" --digest "$EXISTING_DIGEST"
          fi
      - name: Attest the published container
        if: needs.service-plan.outputs.build_required == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: List what the published container contains
        if: needs.service-plan.outputs.build_required == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: .release/service-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Attest the container's contents
        if: needs.service-plan.outputs.build_required == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: .release/service-image.spdx.json
          push-to-registry: true
      - name: Verify provenance and anonymous access before advertising an update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_COMMIT: ${{ needs.main-validation.outputs.commit }}
          BUILD_REQUIRED: ${{ needs.service-plan.outputs.build_required }}
        run: |
          gh attestation verify "oci://$RELEASE_IMAGE@$RELEASE_DIGEST" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT"
          if [ "$BUILD_REQUIRED" = true ]; then
            # The list of contents attested just above, by the same workflow.
            gh attestation verify "oci://$RELEASE_IMAGE@$RELEASE_DIGEST" --repo "$GITHUB_REPOSITORY" --predicate-type "https://spdx.dev/Document/v2.3" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT"
          fi
          python scripts/service_image.py public --tag "$RELEASE_TAG" --digest "$RELEASE_DIGEST"
          python scripts/service_image.py app --tag "$RELEASE_TAG" --digest "$RELEASE_DIGEST"

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - main-validation
      - service-plan
      - service-manifest
    # Skipping an unchanged app is allowed; a failed/cancelled gate never is.
    if: >-
      ${{ always() && needs.main-validation.result == 'success' && needs.service-plan.result == 'success' &&
          ((needs.service-plan.outputs.catalog_required == 'false' &&
            needs.service-plan.outputs.build_required == 'false' && needs.service-manifest.result == 'skipped') ||
           (needs.service-plan.outputs.catalog_required == 'true' && needs.service-manifest.result == 'success')) }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.main-validation.outputs.commit }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install release validation tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/check_release_tag.py "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build HACS release zip
        run: python scripts/build_hacs_release.py
      - name: Generate release metadata
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          python scripts/write_release_assets.py \
            --zip "$RELEASE_ZIP" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --sha256sums "$RELEASE_SHA256SUMS" \
            --metadata "$RELEASE_METADATA" \
            --sbom "$RELEASE_SBOM"
      - name: Validate SPDX SBOM
        run: pyspdxtools -i "$RELEASE_SBOM"
      - name: Verify release assets
        run: |
          test -s "$RELEASE_ZIP"
          test -s "$RELEASE_SHA256SUMS"
          test -s "$RELEASE_METADATA"
          test -s "$RELEASE_SBOM"
          (cd .release && sha256sum -c SHA256SUMS)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ha-mennekes-amtron-release
          include-hidden-files: true
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA256SUMS }}
            ${{ env.RELEASE_METADATA }}
            ${{ env.RELEASE_SBOM }}
          if-no-files-found: error
      # Artifact attestations need a public repository or a paid plan. The
      # release is still reproducible from the committed SHA256SUMS and SBOM
      # without them, and the steps start working by themselves once the
      # repository is published.
      - name: Generate artifact attestation
        id: provenance_attestation
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
      - name: Generate SBOM attestation
        id: sbom_attestation
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
          sbom-path: ${{ env.RELEASE_SBOM }}
      - name: Verify generated attestations
        if: github.event.repository.private == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.release-tag.outputs.ref }}
          RELEASE_COMMIT: ${{ steps.release-tag.outputs.commit }}
          PROVENANCE_BUNDLE: ${{ steps.provenance_attestation.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        run: |
          gh attestation verify "$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_COMMIT"
          gh attestation verify "$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$SBOM_BUNDLE" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_COMMIT"
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          python scripts/publish_release.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Verify the published release against the approved source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release-tag.outputs.commit }}
        run: python scripts/release_check.py --ref "$RELEASE_COMMIT" --published --repo "$GITHUB_REPOSITORY"

  service-catalog:
    name: publish app catalog
    needs: [publish, service-manifest, main-validation, service-plan]
    if: >-
      ${{ always() && needs.publish.result == 'success' &&
          needs.service-manifest.result == 'success' && needs.main-validation.result == 'success' &&
          needs.service-plan.result == 'success' && needs.service-plan.outputs.catalog_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: service-catalog
      cancel-in-progress: false
    permissions:
      contents: write
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.main-validation.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Advance app catalogs after release verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_DIGEST: ${{ needs.service-manifest.outputs.digest }}
        run: python scripts/publish_service_catalog.py --tag "$RELEASE_TAG" --digest "$RELEASE_DIGEST"
