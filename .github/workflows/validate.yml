name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum entry proves the integration runs on the oldest
          # supported release; the current entry additionally type-checks it,
          # because Home Assistant's own annotations moved from voluptuous to
          # probatio in 2026.10 and cannot both be satisfied at once.
          - name: min-ha
            python-version: "3.14"
            homeassistant: "2026.9.0"
            requirements-lock: requirements-dev-min-ha.txt
            validate-arguments: "--skip-typing"
          - name: current-ha
            python-version: "3.14"
            homeassistant: "2026.10.0"
            requirements-lock: requirements-dev.txt
            validate-arguments: ""
          # Fixed November compatibility target; next-ha still tracks new betas.
          - name: preview-ha
            python-version: "3.14"
            homeassistant: "2026.11.0b1"
            requirements-lock: requirements-dev.txt
            validate-arguments: ""
    name: validate (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the release-tag gate compares against previous tags.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python validation tools
        run: |
          python -m pip install "homeassistant==${{ matrix.homeassistant }}"
          python -m pip install -r "${{ matrix.requirements-lock }}"
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          expected = "${{ matrix.homeassistant }}"
          actual = version("homeassistant")
          if actual != expected:
              raise SystemExit(f"homeassistant lock mismatch: expected {expected}, got {actual}")
          PY
      - name: Validation gates
        run: python scripts/check_validate.py ${{ matrix.validate-arguments }}

  # Early warning for the next Home Assistant release. It is allowed to fail:
  # a pre-release breaking is information, not a reason to block a merge. When
  # it goes stable, it moves into the matrix above.
  #
  # The version is resolved rather than pinned. A pinned beta goes stale the
  # moment it is superseded, which turns the job into a test of an obsolete
  # release instead of the next one. With --pre, pip installs the newest
  # version there is; while no pre-release is newer than the current stable
  # that is the stable itself, and the job simply agrees with the matrix.
  next-ha:
    name: next-ha (early warning)
    runs-on: ubuntu-24.04
    # PRs retain an advisory preview; unattended/manual maintenance runs must
    # fail visibly so compatibility regressions do not disappear in green CI.
    continue-on-error: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the next Home Assistant
        run: |
          python -m pip install --pre --upgrade homeassistant
          python -m pip install -r requirements-dev.txt
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
      - name: Report the resolved version
        run: |
          python - <<'PY'
          from importlib.metadata import version

          print(f"::notice::next-ha resolved homeassistant=={version('homeassistant')}")
          PY
      - name: Validation gates
        run: python scripts/check_validate.py

  latest-stable-ha:
    name: latest stable HA
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install latest stable HA and validation tools
        run: |
          python -m pip install --upgrade homeassistant
          python -m pip install -r requirements-dev.txt
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
      - name: Verify the selected stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_ha_channel.py
      - name: Validation gates
        run: python scripts/check_validate.py

  runtime-soak:
    name: runtime resource soak
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install current HA and validation tools
        run: |
          python -m pip install homeassistant==2026.10.0
          python -m pip install -r requirements-dev.txt
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
      - name: Measure repeated lifecycle, recovery and serial cleanup
        run: python scripts/check_runtime_soak.py --cycles 30 --idle-seconds 10

  public-privacy:
    name: public privacy audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Inspect published text and release assets without modifying GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_github_public.py --hacs-pr 11749

  dependabot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependabot configuration
        run: |
          test -f .github/dependabot.yml
          grep -F 'package-ecosystem: "github-actions"' .github/dependabot.yml
          grep -F 'package-ecosystem: "pip"' .github/dependabot.yml

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
