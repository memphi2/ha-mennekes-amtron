name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

# Superseded PR heads can stop; main and scheduled evidence must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum entry proves the integration runs on the oldest
          # supported release; latest stable additionally type-checks it,
          # because Home Assistant's own annotations moved from voluptuous to
          # probatio in 2026.10 and cannot both be satisfied at once.
          - name: min-ha
            python-version: "3.14"
            homeassistant: "2026.9.0"
            requirements-lock: requirements-dev-min-ha.txt
            validate-arguments: "--skip-typing"
          - name: latest-ha
            python-version: "3.14"
            homeassistant: "latest"
            requirements-lock: requirements-dev.txt
            validate-arguments: ""
    name: validate (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the release-tag gate compares against previous tags.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.requirements-lock }}
            custom_components/mennekes_amtron_rtu/manifest.json
      - name: Install Python validation tools
        env:
          HA_TARGET: ${{ matrix.homeassistant }}
          REQUIREMENTS_LOCK: ${{ matrix.requirements-lock }}
        run: |
          if [ "$HA_TARGET" = latest ]; then
            python -m pip install --upgrade homeassistant
          else
            python -m pip install "homeassistant==$HA_TARGET"
          fi
          python -m pip install -r "$REQUIREMENTS_LOCK"
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
      - name: Verify installed Home Assistant target
        env:
          HA_TARGET: ${{ matrix.homeassistant }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_ha_channel.py --expected "$HA_TARGET"
      - name: Validation gates
        run: python scripts/check_validate.py ${{ matrix.validate-arguments }}

  # Preview checks are maintenance signals, not part of the PR/release matrix.
  # Resolve the newest available prerelease instead of keeping an old beta pin.
  next-ha:
    name: next-ha (early warning)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            custom_components/mennekes_amtron_rtu/manifest.json
      - name: Install the next Home Assistant
        run: |
          python -m pip install --pre --upgrade homeassistant
          python -m pip install -r requirements-dev.txt
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
      - name: Report the resolved version
        run: |
          python - <<'PY'
          from importlib.metadata import version

          print(f"::notice::next-ha resolved homeassistant=={version('homeassistant')}")
          PY
      - name: Validation gates
        run: python scripts/check_validate.py

  runtime-soak:
    name: runtime resource soak
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            custom_components/mennekes_amtron_rtu/manifest.json
      - name: Install latest stable HA and validation tools
        run: |
          python -m pip install --upgrade homeassistant
          python -m pip install -r requirements-dev.txt
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
      - name: Verify latest stable HA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_ha_channel.py
      - name: Measure repeated lifecycle, recovery and serial cleanup
        run: python scripts/check_runtime_soak.py --cycles 30 --idle-seconds 10

  runtime-steady:
    name: continuous runtime soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            custom_components/mennekes_amtron_rtu/manifest.json
      - name: Install latest stable HA and validation tools
        run: |
          python -m pip install --upgrade homeassistant
          python -m pip install -r requirements-dev.txt
          python scripts/check_pymodbus_pin.py --install
          python -m pip check
      - name: Verify latest stable HA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_ha_channel.py
      - name: Measure one hour without reloading the entry
        run: python scripts/check_runtime_steady.py --seconds 3600 --json-output /tmp/amtron-steady.json
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amtron-steady-runtime
          path: /tmp/amtron-steady.json
          if-no-files-found: error

  public-privacy:
    name: public privacy audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Inspect published text and release assets without modifying GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_github_public.py --hacs-pr 11749

  dependabot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependabot configuration
        run: |
          test -f .github/dependabot.yml
          grep -F 'package-ecosystem: "github-actions"' .github/dependabot.yml
          grep -F 'package-ecosystem: "pip"' .github/dependabot.yml

  hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
